  * { box-sizing: border-box; }
  body {

    flex-direction: column;

  }
  .header {

    color: #ffffff;

    align-items: center;

    z-index: 100;

    align-items: center;

  .logo-icon {
    background: #ffffff;

    width: 42px;
    height: 42px;

    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 900;
  }
  .logo-text {
    display: flex;
    flex-direction: column;
  }
  .logo-title {
    font-size: 19px;

  }
  .logo-domain {
    font-size: 12px;

    font-weight: 700;

  }
  .sys-info-area {

  .sys-info-item {

  .nav-item {
    padding: 18px 22px;
    color: #333;
    font-weight: 900;
    font-size: 38px;

    border-top: none;

  .nav-item-icon {

  }
  .content-area {
    background: #ffffff;
    flex-grow: 1;
    position: relative;

  .iframe-loading {
    position: absolute;
    inset: 0;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 10;
    transition: opacity 0.3s;
  }
  .iframe-loading.hidden {
    opacity: 0;
    pointer-events: none;
    display: none;
  }
  .loading-spinner {
    width: 48px;
    height: 48px;
    border: 5px solid #f0f0f0;
    border-top: 5px solid #7B1F2A;
    border-radius: 50%;

    0% { transform: rotate(0deg); }

  .loading-text {
    color: #1A237E;
    font-size: 15px;
    font-weight: 900;
  }
  .content-iframe {
    width: 100%;

    .footer-divider { display: none !important; }
  }

function decodeContent(b64) {
  try {
    var bytes = Uint8Array.from(atob(b64), function(c) { return c.charCodeAt(0); });
    return new TextDecoder('utf-8').decode(bytes);
  } catch (e) {
    return '<html><body><h1>오류</h1></body></html>';
  }
}

var iframe = document.getElementById('content');
var loading = document.getElementById('loading');
var nav = document.getElementById('nav');

SCREENS_META.forEach(function(s, idx) {
  var btn = document.createElement('button');
  btn.className = 'nav-item' + (idx === 0 ? ' active' : '');
  btn.dataset.screen = s.key;
  btn.innerHTML = '<span class="nav-item-icon">' + s.icon + '</span><span>' + s.name + '</span>';
  btn.addEventListener('click', function() { navigateTo(s.key); });
  nav.appendChild(btn);
});

function navigateTo(key) {
  if (!SCREENS_B64[key]) return;
  var items = document.querySelectorAll('.nav-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle('active', items[i].dataset.screen === key);
  }
  loading.classList.remove('hidden');
  iframe.srcdoc = decodeContent(SCREENS_B64[key]);
  setTimeout(function() { loading.classList.add('hidden'); }, 300);
  var meta = SCREENS_META.find(function(s) { return s.key === key; });
  if (meta) document.title = 'axdata · ' + meta.name;
  try { window.scrollTo(0, 0); } catch(e) {}
}

iframe.addEventListener('load', function() { loading.classList.add('hidden'); });

window.addEventListener('message', function(e) {
  if (e.data && e.data.action === 'navigate' && SCREENS_B64[e.data.screen]) {
    navigateTo(e.data.screen);
  }
});

navigateTo('hero');
</script>
