<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>saas.html 히어로 영역 보완본 (책 캡처용)</title>
<style>
  /* ============================================
     [3도 인쇄 색상 - 책 출간용]
     NAVY  #1A237E
     WINE  #7B1F2A
     BLACK #000000
     ============================================ */

  body {
    font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    margin: 0;
    padding: 40px 20px;
    background: #ffffff;
  }

  /* ===== 히어로 영역 (메인 타이틀 + 부제 + 6단계) ===== */
  .hero-intro {
    max-width: 1200px;
    margin: 0 auto;
    text-align: center;
  }

  /* [보완 1] 메인 제목 - NAVY, 크게 */
  .hero-title {
    color: #1A237E;
    font-size: 42px;
    font-weight: 900;
    margin: 0 0 20px 0;
    letter-spacing: -1px;
    line-height: 1.3;
  }

  /* [보완 1+2] 부제 - 회색 → 검정, 22px Bold */
  .hero-subtitle {
    color: #000000;       /* 흑백 적용 (회색 #666 X) */
    font-size: 22px;      /* 책 캡처시 보이도록 키움 */
    font-weight: 700;     /* Bold */
    margin: 0 0 36px 0;
    line-height: 1.5;
  }

  /* [보완 4] 6단계 박스 - NAVY 3px 테두리 */
  .step-flow-box {
    display: flex;
    justify-content: space-between;   /* [보완 3] 좌끝~우끝 균등 */
    align-items: center;
    border: 3px solid #1A237E;        /* NAVY 박스 */
    border-radius: 16px;
    padding: 28px 32px;
    background: #ffffff;
    gap: 8px;
  }

  /* 6개 단계 원형 버튼 - WINE */
  .step-circle {
    background: #7B1F2A;              /* WINE */
    color: #ffffff;
    font-size: 20px;                  /* 큰 글자 */
    font-weight: 700;
    padding: 18px 26px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* [보완 3] 화살표 - flex-grow:1 로 균등 분배 */
  .step-arrow {
    color: #000000;                   /* 흑백 */
    font-size: 28px;
    font-weight: 900;
    flex-grow: 1;                     /* 화살표 영역이 늘어나며 균등 배치 */
    text-align: center;
  }

  /* ===== 보조 영역 (PDF·DOCX·... 파일 형식 안내) ===== */
  .file-types-bar {
    margin: 28px auto 0 auto;
    max-width: 1200px;
    background: #ffffff;
    border: 2px solid #000000;        /* [보완 4] 박스 처리 */
    border-radius: 12px;
    padding: 18px 24px;
    text-align: center;
  }

  .file-types-bar .label {
    color: #000000;                   /* [보완 2] 회색 → 검정 */
    font-size: 18px;                  /* [보완 1] 12~14px → 18px 키움 */
    font-weight: 700;
  }

  /* ===== 상단 안내바 (파일·폴더·ZIP 모두 자동 처리) ===== */
  .top-banner {
    background: #1A237E;              /* NAVY */
    color: #ffffff;
    text-align: center;
    padding: 14px 20px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin: 0 0 32px 0;
  }
</style>
</head>
<body>

<!-- ============================================
     캡처1: 상단 안내바 (NAVY 배경)
     ============================================ -->
<div class="top-banner">
  파일 · 폴더 · ZIP 모두 자동 처리
</div>

<!-- ============================================
     캡처4: 히어로 영역 (보완 1~4 모두 적용)
     ============================================ -->
<section class="hero-intro">

  <!-- 메인 제목: NAVY, 42px, Black -->
  <h1 class="hero-title">
    비정형 데이터 → AX 시스템 자동 구축
  </h1>

  <!-- 부제: [보완 1+2] 검정, 22px Bold -->
  <p class="hero-subtitle">
    파일 업로드 1번 → 5W1H 6채널 구조화 → 평가 → 보완 → AI 학습 → AX 완성
  </p>

  <!-- 6단계 박스: [보완 3+4] NAVY 박스 + 좌끝~우끝 균등 -->
  <div class="step-flow-box">
    <div class="step-circle">① 압축해제</div>
    <span class="step-arrow">→</span>
    <div class="step-circle">② 구조화</div>
    <span class="step-arrow">→</span>
    <div class="step-circle">③ 평가</div>
    <span class="step-arrow">→</span>
    <div class="step-circle">④ 보완</div>
    <span class="step-arrow">→</span>
    <div class="step-circle">⑤ AI 학습</div>
    <span class="step-arrow">→</span>
    <div class="step-circle">⑥ AX 구축</div>
  </div>

</section>

<!-- ============================================
     캡처2: 파일 형식 안내바 (보완 1+2+4 적용)
     ============================================ -->
<div class="file-types-bar">
  <span class="label">
    PDF · DOCX · XLSX · TXT · CSV · JSON · XML · ZIP 모두 지원 (혼합 · 중첩 가능)
  </span>
</div>

</body>
</html>
