const chatBox = document.getElementById('chatBox');
const welcomeMsg = document.getElementById('welcomeMsg');
const qaInput = document.getElementById('qaInput');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');

// ============================================
// 질문 분석 및 매칭
// ============================================

function findMatchingDocs(question) {
  const q = question.toLowerCase();
  const scored = SAMPLE_DATA.map(doc => {
    let score = 0;
    // 제목 매칭 (가장 강력)
    if (doc.title.toLowerCase().includes(q)) score += 50;
    // 키워드 매칭
    doc.keywords.forEach(kw => {
      if (q.includes(kw.toLowerCase())) score += 20;
    });
    // 6채널 텍스트 매칭
    CHANNELS.forEach(ch => {
      if (doc[ch.key].toLowerCase().includes(q)) score += 10;
    });
    // 부분 단어 매칭
    const qWords = q.split(/\s+/).filter(w => w.length >= 2);
    qWords.forEach(word => {
      if (doc.title.toLowerCase().includes(word)) score += 8;
      doc.keywords.forEach(kw => {
        if (kw.toLowerCase().includes(word)) score += 5;
      });
      CHANNELS.forEach(ch => {
        if (doc[ch.key].toLowerCase().includes(word)) score += 3;
      });
    });
    return { doc, score };
  });

  return scored
    .filter(s => s.score > 0)
    .sort((a, b) => b.score - a.score)
    .map(s => s.doc);
}

function getQuestionType(question) {
  const q = question.toLowerCase();
  if (q.includes('어떻게') || q.includes('방법') || q.includes('절차')) return 'how';
  if (q.includes('언제') || q.includes('시간') || q.includes('주기')) return 'when';
  if (q.includes('어디') || q.includes('장소') || q.includes('위치')) return 'where';
  if (q.includes('누가') || q.includes('담당') || q.includes('책임')) return 'who';
  if (q.includes('왜') || q.includes('이유') || q.includes('목적')) return 'why';
  if (q.includes('무엇') || q.includes('뭐')) return 'what';
  return 'all';
}

function generateAnswer(question) {
  const matched = findMatchingDocs(question);
  const qType = getQuestionType(question);

  if (matched.length === 0) {
    return {
      noMatch: true,
      text: '죄송합니다. 학습된 데이터에서 관련 정보를 찾지 못했습니다.\n\n다른 방식으로 질문해 주시거나, 검색 화면에서 직접 자료를 찾아보실 수 있습니다.',
      sources: [],
      followups: [
        '🛡️ 작업장 안전 수칙은 무엇인가요?',
        '✅ 품질 점검 절차는?',
        '🚨 응급 상황 대응은?'
      ]
    };
  }

  const primary = matched[0];
  const sources = matched.slice(0, 3);

  return {
    primary: primary,
    sources: sources,
    qType: qType,
    followups: generateFollowups(primary, matched)
  };
}

function generateFollowups(primary, allMatched) {
  const followups = [];
  followups.push(primary.title + '의 상세 절차는?');
  followups.push(primary.who + '의 연락처를 알려주세요');
  if (allMatched.length > 1) {
    followups.push('관련된 다른 자료는?');
  }
  return followups.slice(0, 3);
}

// ============================================
// 메시지 추가
// ============================================

function getTimeStr() {
  const d = new Date();
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  return h + ':' + m;
}

function addUserMessage(text) {
  const html =
    '<div class="msg user">' +
      '<div class="msg-avatar">나</div>' +
      '<div>' +
        '<div class="msg-bubble">' + escapeHtml(text) + '</div>' +
        '<div class="msg-time">' + getTimeStr() + '</div>' +
      '</div>' +
    '</div>';
  chatBox.insertAdjacentHTML('beforeend', html);
  scrollToBottom();
}

function addTypingIndicator() {
  const html =
    '<div class="msg ai" id="typingMsg">' +
      '<div class="msg-avatar">AI</div>' +
      '<div class="msg-bubble">' +
        '<div class="typing">' +
          '<div class="typing-dot"></div>' +
          '<div class="typing-dot"></div>' +
          '<div class="typing-dot"></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  chatBox.insertAdjacentHTML('beforeend', html);
  scrollToBottom();
}

function removeTypingIndicator() {
  const el = document.getElementById('typingMsg');
  if (el) el.remove();
}

function addAIMessage(answer) {
  let bubbleHtml = '';

  if (answer.noMatch) {
    bubbleHtml += '<div style="color:#7B1F2A;font-weight:900;margin-bottom:8px;">⚠️ 관련 정보를 찾지 못했습니다</div>';
    bubbleHtml += '<div style="white-space:pre-line;">' + escapeHtml(answer.text) + '</div>';
  } else {
    const p = answer.primary;
    bubbleHtml += '<div class="ai-answer-title">📌 ' + escapeHtml(p.title) + '</div>';
    bubbleHtml += '<div class="ai-answer-channels">';
    CHANNELS.forEach(ch => {
      bubbleHtml += '<div class="ai-channel-line">';
      bubbleHtml += '<span class="ai-channel-icon">' + ch.icon + ' ' + ch.ko + ':</span>';
      bubbleHtml += escapeHtml(p[ch.key]);
      bubbleHtml += '</div>';
    });
    bubbleHtml += '</div>';

    // 출처 카드
    if (answer.sources.length > 0) {
      bubbleHtml += '<div class="ai-sources">';
      bubbleHtml += '<div class="ai-sources-title">📂 참고 자료 ' + answer.sources.length + '건</div>';
      answer.sources.forEach(s => {
        const gCls = s.grade === 'B' ? ' b' : (s.grade === 'C' ? ' c' : '');
        bubbleHtml += '<div class="ai-source-item" data-id="' + s.id + '">';
        bubbleHtml += '<span class="ai-source-name">' + escapeHtml(s.source) + '</span>';
        bubbleHtml += '<span class="ai-source-grade' + gCls + '">' + s.grade + '</span>';
        bubbleHtml += '</div>';
      });
      bubbleHtml += '</div>';
    }
  }

  // 후속 질문
  if (answer.followups && answer.followups.length > 0) {
    bubbleHtml += '<div class="ai-followups">';
    bubbleHtml += '<div class="ai-followups-title">💡 추가로 물어볼 만한 질문</div>';
    answer.followups.forEach(f => {
      bubbleHtml += '<button class="ai-followup-btn" data-q="' + escapeHtmlAttr(f) + '">↩ ' + escapeHtml(f) + '</button>';
    });
    bubbleHtml += '</div>';
  }

  // 만족도
  if (!answer.noMatch) {
    bubbleHtml += '<div class="ai-feedback">';
    bubbleHtml += '<span class="ai-feedback-label">답변이 도움됐나요?</span>';
    bubbleHtml += '<button class="ai-feedback-btn" data-fb="up">👍</button>';
    bubbleHtml += '<button class="ai-feedback-btn" data-fb="down">👎</button>';
    bubbleHtml += '</div>';
  }

  const html =
    '<div class="msg ai">' +
      '<div class="msg-avatar">AI</div>' +
      '<div>' +
        '<div class="msg-bubble">' + bubbleHtml + '</div>' +
        '<div class="msg-time">' + getTimeStr() + '</div>' +
      '</div>' +
    '</div>';

  chatBox.insertAdjacentHTML('beforeend', html);
  scrollToBottom();

  // 이벤트 바인딩
  bindLastAIMessageEvents();
}

function bindLastAIMessageEvents() {
  // 후속 질문 클릭
  chatBox.querySelectorAll('.ai-followup-btn').forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', () => {
      qaInput.value = btn.dataset.q;
      sendQuestion();
    });
  });

  // 출처 카드 클릭
  chatBox.querySelectorAll('.ai-source-item').forEach(item => {
    if (item.dataset.bound) return;
    item.dataset.bound = '1';
    item.addEventListener('click', () => {
      const id = item.dataset.id;
      const doc = SAMPLE_DATA.find(d => d.id === id);
      if (doc) {
        alert('📂 ' + doc.title + '\n\n전체 내용은 검색 화면에서 확인 가능합니다.\n\n출처: ' + doc.source + '\n등록: ' + doc.date + '\n등급: ' + doc.grade);
      }
    });
  });

  // 만족도
  chatBox.querySelectorAll('.ai-feedback-btn').forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', () => {
      const fb = btn.dataset.fb;
      const parent = btn.parentElement;
      parent.querySelectorAll('.ai-feedback-btn').forEach(b => b.classList.remove('selected', 'up', 'down'));
      btn.classList.add('selected', fb);
      const msg = fb === 'up' ? '✅ 피드백 감사합니다!' : '⚠️ 의견 주셔서 감사합니다. 답변 품질 개선에 반영됩니다.';
      // 작은 토스트 효과 대신 비활성 처리만
      btn.disabled = true;
    });
  });
}

function scrollToBottom() {
  setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 50);
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function escapeHtmlAttr(s) {
  return escapeHtml(s).replace(/"/g, '&quot;');
}

// ============================================
// 질문 전송
// ============================================

async function sendQuestion() {
  const text = qaInput.value.trim();
  if (text.length === 0) return;

  // 환영 메시지 숨김
  if (welcomeMsg) {
    welcomeMsg.style.display = 'none';
  }

  qaInput.value = '';
  qaInput.disabled = true;
  sendBtn.disabled = true;

  addUserMessage(text);

  // 타이핑 인디케이터
  addTypingIndicator();

  // 답변 생성 시뮬레이션 (1.2초)
  await new Promise(r => setTimeout(r, 1200));

  removeTypingIndicator();

  const answer = generateAnswer(text);
  addAIMessage(answer);

  qaInput.disabled = false;
  sendBtn.disabled = false;
  qaInput.focus();
}

sendBtn.addEventListener('click', sendQuestion);
qaInput.addEventListener('keypress', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendQuestion();
  }
});

// 빠른 질문
document.querySelectorAll('.welcome-quick-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    qaInput.value = btn.dataset.q;
    sendQuestion();
  });
});

// 새 대화 (초기화)
clearBtn.addEventListener('click', () => {
  if (chatBox.querySelectorAll('.msg').length === 0) return;
  if (!confirm('대화를 모두 초기화하시겠습니까?')) return;
  chatBox.innerHTML = '';
  chatBox.appendChild(welcomeMsg);
  welcomeMsg.style.display = '';
});

document.querySelectorAll('.bottom-btn[data-nav]').forEach(btn => {
  btn.addEventListener('click', () => {
    const nav = btn.dataset.nav;
    const labels = {
      'search': '🔍 검색',
      'dashboard': '📊 대시보드',
      'report': '📑 보고서'
    };
    alert(labels[nav] + ' 화면으로 이동합니다.\n\n(해당 화면 제작 후 연결됩니다)');
  });
});
</script>
