<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>saas.html 히어로 영역 통합 박스 보완본 v2 (교육용)</title>
<style>
  /* ============================================
     [3도 인쇄 색상]
     NAVY  #1A237E
     WINE  #7B1F2A
     BLACK #000000
     ============================================ */

  body {
    font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    margin: 0;
    padding: 40px 20px;
    background: #ffffff;
  }

  /* ===== 상단 안내바 (NAVY 배경) ===== */
  .top-banner {
    background: #1A237E;
    color: #ffffff;
    text-align: center;
    padding: 14px 20px;
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 36px 0;
  }

  /* ============================================
     [핵심 보완] 통합 박스 - 좌우 기준선 정확히 일치
     제목 + 부제 + 6단계 모두 하나의 NAVY 박스 안에
     ============================================ */
  .hero-wrapper {
    max-width: 1200px;
    margin: 0 auto 28px auto;
    border: 3px solid #1A237E;        /* NAVY 통합 박스 */
    border-radius: 16px;
    padding: 44px 40px;                /* 좌우 padding 통일 */
    background: #ffffff;
    text-align: center;
    box-sizing: border-box;
  }

  /* 메인 제목 */
  .hero-title {
    color: #1A237E;
    font-size: 42px;
    font-weight: 900;
    margin: 0 0 18px 0;
    letter-spacing: -1px;
    line-height: 1.3;
  }

  /* 부제 (검정·22px Bold) */
  .hero-subtitle {
    color: #000000;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 32px 0;
    line-height: 1.5;
  }

  /* 박스 내부 구분선 (NAVY 얇은 선) */
  .hero-divider {
    border: none;
    border-top: 1px solid #1A237E;
    opacity: 0.25;
    margin: 0 0 32px 0;
  }

  /* ===== 6단계 아이콘 - 별도 박스 없이 통합 박스 안에 평면 배치 ===== */
  .step-flow {
    display: flex;
    justify-content: space-between;   /* 좌끝~우끝 균등 */
    align-items: center;
    gap: 6px;
  }

  .step-circle {
    background: #7B1F2A;              /* WINE */
    color: #ffffff;
    font-size: 20px;
    font-weight: 700;
    padding: 18px 26px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .step-arrow {
    color: #000000;                   /* 흑백 */
    font-size: 28px;
    font-weight: 900;
    flex-grow: 1;                     /* 화살표 영역이 늘어나며 균등 */
    text-align: center;
  }

  /* ===== 파일 형식 안내바 - 통합 박스와 좌우 기준선 일치 ===== */
  .file-types-bar {
    max-width: 1200px;                /* 위 박스와 동일 width */
    margin: 0 auto;
    background: #ffffff;
    border: 2px solid #000000;
    border-radius: 12px;
    padding: 18px 40px;                /* 좌우 padding 통일 */
    text-align: center;
    box-sizing: border-box;
  }

  .file-types-bar .label {
    color: #000000;
    font-size: 18px;
    font-weight: 700;
  }
</style>
</head>
<body>

<!-- 상단 NAVY 안내바 -->
<div class="top-banner">
  파일 · 폴더 · ZIP 모두 자동 처리
</div>

<!-- ============================================
     [통합 박스] 제목 + 부제 + 6단계
     좌우 기준선 정확히 일치 → 교육시 한 묶음 설명 가능
     ============================================ -->
<section class="hero-wrapper">

  <h1 class="hero-title">
    비정형 데이터 → AX 시스템 자동 구축
  </h1>

  <p class="hero-subtitle">
    파일 업로드 1번 → 5W1H 6채널 구조화 → 평가 → 보완 → AI 학습 → AX 완성
  </p>

  <hr class="hero-divider">

  <!-- 6단계: 통합 박스 안에 평면 배치 (별도 박스 X) -->
  <div class="step-flow">
    <div class="step-circle">① 압축해제</div>
    <span class="step-arrow">→</span>
    <div class="step-circle">② 구조화</div>
    <span class="step-arrow">→</span>
    <div class="step-circle">③ 평가</div>
    <span class="step-arrow">→</span>
    <div class="step-circle">④ 보완</div>
    <span class="step-arrow">→</span>
    <div class="step-circle">⑤ AI 학습</div>
    <span class="step-arrow">→</span>
    <div class="step-circle">⑥ AX 구축</div>
  </div>

</section>

<!-- ============================================
     파일 형식 안내 - 별도 박스, 좌우 기준선은 위와 동일
     ============================================ -->
<div class="file-types-bar">
  <span class="label">
    PDF · DOCX · XLSX · TXT · CSV · JSON · XML · ZIP 모두 지원 (혼합 · 중첩 가능)
  </span>
</div>

</body>
</html>
