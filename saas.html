: #000000;\n    font-size: 15px;\n    font-weight: 700;\n  }\n\n  .ax-resource-value {\n    color: #1A237E;\n    font-size: 18px;\n    font-weight: 900;\n    font-family: 'Courier New', monospace;\n  }\n\n  .ax-resource-value.pending {\n    color: #888;\n    font-size: 14px;\n    font-weight: 700;\n    font-family: inherit;\n    font-style: italic;\n  }\n\n  /* ============================================\n     [v8 신규] 완료 화면 액션 버튼 4개\n     ============================================ */\n  .complete-box { border: 3px solid #1A237E; background: #1A237E; color: #ffffff; border-radius: 14px; padding: 36px 30px; margin: 28px 0; text-align: center; display: none; }\n  .complete-box.show { display: block; }\n  .complete-icon { font-size: 56px; margin: 0 0 12px 0; line-height: 1; }\n  .complete-title { font-size: 32px; font-weight: 900; margin: 0 0 14px 0; }\n  .complete-summary { font-size: 20px; font-weight: 700; margin: 0 0 22px 0; }\n\n  .complete-info {\n    background: rgba(255,255,255,0.12);\n    border: 2px solid rgba(255,255,255,0.4);\n    border-radius: 10px;\n    padding: 14px 20px;\n    margin: 0 0 22px 0;\n    display: grid;\n    grid-template-columns: repeat(2, 1fr);\n    gap: 8px;\n    text-align: left;\n    font-size: 15px;\n    font-weight: 700;\n  }\n\n  .complete-info-row {\n    display: flex;\n    justify-content: space-between;\n  }\n\n  .complete-info-label { opacity: 0.85; }\n  .complete-info-value { font-family: 'Courier New', monospace; font-weight: 900; }\n\n  .complete-actions {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 10px;\n    margin: 0 0 22px 0;\n  }\n\n  .action-btn {\n    background: #ffffff;\n    color: #1A237E;\n    font-size: 16px;\n    font-weight: 900;\n    padding: 18px 10px;\n    border: none;\n    border-radius: 12px;\n    cursor: pointer;\n    transition: all 0.2s;\n  }\n\n  .action-btn:hover { background: #f0f0f0; transform: translateY(-2px); }\n\n  .action-icon { font-size: 28px; display: block; m owse-btn\" id=\"browseBtn\" type=\"button\">파일 선택<\/button>\n  <\/div>\n\n  <input type=\"file\" id=\"fileInput\" multiple accept=\".pdf,.docx,.xlsx,.txt,.csv,.json,.xml,.zip\" style=\"display:none\">\n\n  <div class=\"file-list-box\" id=\"fileListBox\">\n    <div class=\"file-list-title\" id=\"fileListTitle\">📂 업로드된 파일 (0개)<\/div>\n    <div id=\"fileList\"><div class=\"empty-msg\">아직 선택된 파일이 없습니다<\/div><\/div>\n  <\/div>\n\n  <button class=\"ax-start-btn\" id=\"axStartBtn\" disabled>AX 자동 구축 시작 →<\/button>\n\n  <div class=\"progress-box\" id=\"progressBox\">\n    <div class=\"progress-step-num\" id=\"progStepNum\">①<\/div>\n    <div class=\"progress-step-name\" id=\"progStepName\">압축해제<\/div>\n    <div class=\"progress-message\" id=\"progMessage\">압축파일 자동 해제 중...<\/div>\n    <div class=\"progress-bar-bg\"><div class=\"progress-bar-fill\" id=\"progBarFill\"><\/div><\/div>\n  <\/div>\n\n  <div class=\"eval-box\" id=\"evalBox\">\n    <div class=\"eval-title\">③ 5W1H 6채널 품질 평가 결과 <span class=\"eval-iter-badge\" id=\"evalIterBadge\">1차<\/span><\/div>\n    <div class=\"eval-subtitle\">정상 = A 등급 / 1채널 오류 = B 등급 / 2채널 오류 = C 등급<\/div>\n    <div class=\"eval-grid\" id=\"evalGrid\"><\/div>\n    <div class=\"eval-all-a\" id=\"evalAllA\">✅ 모든 채널 A 등급 달성! 보완 완료<\/div>\n  <\/div>\n\n  <div class=\"feedback-box\" id=\"feedbackBox\">\n    <div class=\"fb-icon\">⚠️<\/div>\n    <div class=\"fb-title\">④ 보완 모드 선택 <span class=\"fb-iter-badge\" id=\"fbIterBadge\">1차<\/span><\/div>\n    <div class=\"fb-message\" id=\"fbMessage\">B/C 등급 채널이 발견됐습니다.<br>보완 방식을 선택해 주세요.<\/div>\n    <div class=\"fb-buttons\">\n      <button class=\"fb-btn\" data-mode=\"auto\"><span class=\"fb-btn-icon\">🤖<\/span>자동 보완<div class=\"fb-btn-desc\">AI가 알아서 보완<\/div><\/button>\n      <button class=\"fb-btn\" data-mode=\"manual\"><span class=\"fb-btn-icon\">✍️<\/span>직접 수정<div class=\"fb-btn-desc\">사용자가 직접 입력<\/div><\/button>\n      <button class=\"fb-btn\" data-mode=\"skip\"><span class=\"fb-btn-icon\">⏭️<\/span>이대로 진행<div class=\"fb-btn-desc\">보완 없이 다음 단계<\/div><\/button>\n    <\/div>\n    <div class=\"manual-box\" id=\"manualBox\">\n      <div class=\"manual-title\">✍️ 직접 수정할 채널 입력<\/div>\n      <div class=\"manual-channels\" id=\"manualChannels\"><\/div>\n      <textarea class=\"manual-textarea\" id=\"manualText\" placeholder=\"보완할 내용을 직접 입력하세요. (예: 일자·담당자·장소 등 추가 정보)\"><\/textarea>\n      <button class=\"manual-submit\" id=\"manualSubmit\">수정 완료 → 재평가<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- AI 학습 박스 -->\n  <div class=\"learning-box\" id=\"learningBox\">\n    <div class=\"lb-title\">⑤ AI 학습 진행 중<\/div>\n    <div class=\"lb-subtitle\">5W1H 6채널 데이터를 AI 엔진에 학습시킵니다<\/div>\n    <div class=\"lb-progress-wrap\">\n      <div class=\"lb-progress-label\"><span>전체 진행률<\/span><span class=\"lb-progress-num\" id=\"lbProgressNum\">0%<\/span><\/div>\n      <div class=\"lb-progress-bg\"><div class=\"lb-progress-fill\" id=\"lbProgressFill\"><\/div><\/div>\n    <\/div>\n    <div class=\"lb-section-title\">📊 학습 단계<\/div>\n    <div class=\"lb-substeps\" id=\"lbSubsteps\"><\/div>\n    <div class=\"lb-section-title\">🔗 5W1H 6채널 학습 상태<\/div>\n    <div class=\"lb-channels\" id=\"lbChannels\"><\/div>\n    <div class=\"lb-section-title\">📈 학습 통계<\/div>\n    <div class=\"lb-stats\">\n      <div class=\"lb-stat\"><div class=\"lb-stat-label\">처리 항목<\/div><div class=\"lb-stat-value\"><span id=\"lbStatItems\">0<\/span><span class=\"lb-stat-unit\">개<\/span><\/div><\/div>\n      <div class=\"lb-stat\"><div class=\"lb-stat-label\">생성 의미 벡터<\/div><div class=\"lb-stat-value\"><span id=\"lbStatVectors\">0<\/span><span class=\"lb-stat-unit\">개<\/span><\/div><\/div>\n      <div class=\"lb-stat\"><div class=\"lb-stat-label\">검색 인덱스<\/div><div class=\"lb-stat-value\"><span id=\"lbStatIndex\">0<\/span><span class=\"lb-stat-unit\">MB<\/span><\/div><\/div>\n      <div class=\"lb-stat\"><div class=\"lb-stat-label\">처리 속도<\/div><div class=\"lb-stat-value\"><span id=\"lbStatSpeed\">0<\/span><span class=\"lb-stat-unit\">항목/초<\/span><\/div><\/div>\n    <\/div>\n    <div class=\"lb-log\">\n      <div class=\"lb-log-title\">📋 학습 진행 로그<\/div>\n      <div class=\"lb-log-content\" id=\"lbLogContent\"><\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ============================================\n       [v8 신규] AX 시스템 구축 박스\n       ============================================ -->\n  <div class=\"ax-build-box\" id=\"axBuildBox\">\n    <div class=\"lb-title\">⑥ AX 시스템 구축 진행 중<\/div>\n    <div class=\"lb-subtitle\">학습된 데이터로 6개 AX 자동화 모듈을 구축합니다<\/div>\n\n    <div class=\"lb-progress-wrap\">\n      <div class=\"lb-progress-label\"><span>전체 구축률<\/span><span class=\"lb-progress-num\" id=\"axProgressNum\">0%<\/span><\/div>\n      <div class=\"lb-progress-bg\"><div class=\"lb-progress-fill\" id=\"axProgressFill\"><\/div><\/div>\n    <\/div>\n\n    <div class=\"lb-section-title\">🏗️ 6개 AX 시스템 모듈<\/div>\n    <div class=\"ax-modules\" id=\"axModules\"><\/div>\n\n    <div class=\"lb-section-title\">🔐 시스템 자원 정보<\/div>\n    <div class=\"ax-resources\" id=\"axResources\">\n      <div class=\"ax-resource\">\n        <span class=\"ax-resource-label\">시스템 ID<\/span>\n        <span class=\"ax-resource-value pending\" id=\"axResId\">배정 대기 중<\/span>\n      <\/div>\n      <div class=\"ax-resource\">\n        <span class=\"ax-resource-label\">사용자 코드<\/span>\n        <span class=\"ax-resource-value pending\" id=\"axResUser\">배정 대기 중<\/span>\n      <\/div>\n      <div class=\"ax-resource\">\n        <span class=\"ax-resource-label\">저장소 위치<\/span>\n        <span class=\"ax-resource-value pending\" id=\"axResStorage\">활성화 대기 중<\/span>\n      <\/div>\n      <div class=\"ax-resource\">\n        <span class=\"ax-resource-label\">접속 경로<\/span>\n        <span class=\"ax-resource-value pending\" id=\"axResUrl\">활성화 대기 중<\/span>\n      <\/div>\n    <\/div>\n\n    <div class=\"lb-log\">\n      <div class=\"lb-log-title\">📋 구축 진행 로그<\/div>\n      <div class=\"lb-log-content\" id=\"axLogContent\"><\/div>\n    <\/div>\n  <\/div>\n\n  <!-- 완료 박스 (v8 강화: 시스템 정보 + 4개 액션 버튼) -->\n  <div class=\"complete-box\" id=\"completeBox\">\n    <div class=\"complete-icon\">🎯<\/div>\n    <div class=\"complete-title\">AX 시스템 구축 완료!<\/div>\n    <div class=\"complete-summary\" id=\"completeSummary\">파일 0개 처리 · 6단계 자동 완료<\/div>\n\n    <div class=\"complete-info\" id=\"completeInfo\">\n      <div class=\"complete-info-row\"><span class=\"complete-info-label\">시스템 ID<\/span><span class=\"complete-info-value\" id=\"finalSysId\">-<\/span><\/div>\n      <div class=\"complete-info-row\"><span class=\"complete-info-label\">사용자 코드<\/span><span class=\"complete-info-value\" id=\"finalUserCode\">-<\/span><\/div>\n      <div class=\"complete-info-row\"><span class=\"complete-info-label\">저장소<\/span><span class=\"complete-info-value\" id=\"finalStorage\">-<\/span><\/div>\n      <div class=\"complete-info-row\"><span class=\"complete-info-label\">접속 경로<\/span><span class=\"complete-info-value\" id=\"finalUrl\">-<\/span><\/div>\n    <\/div>\n\n    <div class=\"complete-actions\">\n      <button class=\"action-btn\" data-action=\"search\">\n        <span class=\"action-icon\">🔍<\/span>\n        검색하기\n      <\/button>\n      <button class=\"action-btn\" data-action=\"qa\">\n        <span class=\"action-icon\">💬<\/span>\n        AI 질의응답\n      <\/button>\n      <button class=\"action-btn\" data-action=\"dashboard\">\n        <span class=\"action-icon\">📊<\/span>\n        대시보드\n      <\/button>\n      <button class=\"action-btn\" data-action=\"report\">\n        <span class=\"action-icon\">📑<\/span>\n        보고서\n      <\/button>\n    <\/div>\n\n    <button class=\"reset-btn\" id=\"resetBtn\">새 작업 시작<\/button>\n  <\/div>\n\n<\/section>\n\n<div class=\"file-types-bar\">\n  <span class=\"label\">PDF · DOCX · XLSX · TXT · CSV · JSON · XML · ZIP 모두 지원 (혼합 · 중첩 가능)<\/span>\n<\/div>\n\n<script>\nconst STEPS = [\n  { num: '①', name: '압축해제', msg: '압축파일을 자동으로 해제합니다' },\n  { num: '②', name: '5W1H 6채널 구조화', msg: '비정형 데이터를 6채널로 구조화합니다' },\n  { num: '③', name: '품질 평가', msg: '5W1H 6채널 등급을 평가합니다' },\n  { num: '④', name: '보완', msg: '미흡 채널을 보완합니다' },\n  { num: '⑤', name: 'AI 학습', msg: '학습 인덱스를 생성합니다' },\n  { num: '⑥', name: 'AX 시스템 구축', msg: 'AX 자동화 시스템을 구축합니다' }\n];\n\nconst ARCHIVE_EXTS = ['zip', 'tar', 'gz', 'rar', '7z', 'tgz'];\n\nconst CHANNELS = [\n  { key: 'why',   label: 'Why',   ko: '왜' },\n  { key: 'what',  label: 'What',  ko: '무엇' },\n  { key: 'when',  label: 'When',  ko: '언제' },\n  { key: 'where', label: 'Where', ko: '어디' },\n  { key: 'who',   label: 'Who',   ko: '누가' },\n  { key: 'how',   label: 'How',   ko: '어떻게' }\n];\n\nconst LEARNING_SUBSTEPS = [\n  { name: '데이터 정제', icon: '🧹', duration: 1500 },\n  { name: '의미 분석', icon: '🔍', duration: 2000 },\n  { name: '검색 인덱스 구축', icon: '📚', duration: 1800 },\n  { name: '질의응답 학습', icon: '💬', duration: 2200 },\n  { name: '학습 검증', icon: '✓',  duration: 1200 }\n];\n\n// [v8] AX 시스템 6모듈\nconst AX_MODULES = [\n  { key: 'storage',   icon: '🗄️', name: '저장소 시스템',     desc: '안전 보관소 구축' },\n  { key: 'search',    icon: '🔍', name: '검색 엔진',          desc: '빠른 검색 구조' },\n  { key: 'chatbot',   icon: '💬', name: 'AI 질의응답',        desc: '대화형 인터페이스' },\n  { key: 'dashboard', icon: '📊', name: '품질 관리 대시보드', desc: '실시간 모니터링' },\n  { key: 'report',    icon: '📑', name: '보고서 자동 생성',   desc: '정기 보고 시스템' },\n  { key: 'analytics', icon: '📈', name: '통계 분석',          desc: '누적 통계 시각화' }\n];\n\nconst EVAL_BY_ITERATION = {\n  1: { why:{grade:'A',issues:0}, what:{grade:'A',issues:0}, when:{grade:'B',issues:1}, where:{grade:'A',issues:0}, who:{grade:'C',issues:2}, how:{grade:'A',issues:0} },\n  2: { why:{grade:'A',issues:0}, what:{grade:'A',issues:0}, when:{grade:'B',issues:1}, where:{grade:'A',issues:0}, who:{grade:'B',issues:1}, how:{grade:'A',issues:0} },\n  3: { why:{grade:'A',issues:0}, what:{grade:'A',issues:0}, when:{grade:'A',issues:0}, where:{grade:'A',issues:0}, who:{grade:'A',issues:0}, how:{grade:'A',issues:0} }\n};\n\n// 시스템 자원 정보 (구축 시 부여)\nfunction genSystemId() {\n  const d = new Date();\n  const yyyy = d.getFullYear();\n  const mm = String(d.getMonth() + 1).padStart(2, '0');\n  const dd = String(d.getDate()).padStart(2, '0');\n  return 'AX-' + yyyy + '-' + mm + dd;\n}\n\nconst SYSTEM_INFO = {\n  id: genSystemId(),\n  user: 'AX-00000',\n  storage: '안전 보관소 (활성)',\n  url: 'axdata.co.kr/dashboard'\n};\n\n// DOM 참조\nconst dropZone = document.getElementById('dropZone');\nconst browseBtn = document.getElementById('browseBtn');\nconst fileInput = document.getElementById('fileInput');\nconst fileList = document.getElementById('fileList');\nconst fileListTitle = document.getElementById('fileListTitle');\nconst axStartBtn = document.getElementById('axStartBtn');\nconst progressBox = document.getElementById('progressBox');\nconst evalBox = document.getElementById('evalBox');\nconst evalGrid = document.getElementById('evalGrid');\nconst evalIterBadge = document.getElementById('evalIterBadge');\nconst evalAllA = document.getElementById('evalAllA');\nconst feedbackBox = document.getElementById('feedbackBox');\nconst fbIterBadge = document.getElementById('fbIterBadge');\nconst fbMessage = document.getElementById('fbMessage');\nconst manualBox = document.getElementById('manualBox');\nconst manualChannels = document.getElementById('manualChannels');\nconst manualText = document.getElementById('manualText');\nconst manualSubmit = document.getElementById('manualSubmit');\nconst completeBox = document.getElementById('completeBox');\nconst resetBtn = document.getElementById('resetBtn');\nconst iterCounter = document.getElementById('iterCounter');\nconst iterAlert = document.getElementById('iterAlert');\nconst iterAlertMain = document.getElementById('iterAlertMain');\nconst iterAlertSub = document.getElementById('iterAlertSub');\nconst learningBox = document.getElementById('learningBox');\nconst lbProgressNum = document.getElementById('lbProgressNum');\nconst lbProgressFill = document.getElementById('lbProgressFill');\nconst lbSubsteps = document.getElementById('lbSubsteps');\nconst lbChannels = document.getElementById('lbChannels');\nconst lbStatItems = document.getElementById('lbStatItems');\nconst lbStatVectors = document.getElementById('lbStatVectors');\nconst lbStatIndex = document.getElementById('lbStatIndex');\nconst lbStatSpeed = document.getElementById('lbStatSpeed');\nconst lbLogContent = document.getElementById('lbLogContent');\n\n// [v8] AX 박스 요소\nconst axBuildBox = document.getElementById('axBuildBox');\nconst axProgressNum = document.getElementById('axProgressNum');\nconst axProgressFill = document.getElementById('axProgressFill');\nconst axModulesEl = document.getElementById('axModules');\nconst axResId = document.getElementById('axResId');\nconst axResUser = document.getElementById('axResUser');\nconst axResStorage = document.getElementById('axResStorage');\nconst axResUrl = document.getElementById('axResUrl');\nconst axLogContent = document.getElementById('axLogContent');\n\nlet selectedFiles = [];\nlet currentIteration = 1;\nlet evaluationResult = null;\nlet userChoiceResolver = null;\nlet isProcessing = false;\n\nfunction scrollToElement(el) { setTimeout(() => { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200); }\nfunction wait(ms) { return new Promise(r => setTimeout(r, ms)); }\n\nbrowseBtn.addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });\ndropZone.addEventListener('click', () => fileInput.click());\nfileInput.addEventListener('change', e => handleFiles(e.target.files));\ndropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });\ndropZone.addEventListener('dragleave', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); });\ndropZone.addEventListener('drop', e => {\n  e.preventDefault();\n  dropZone.classList.remove('drag-over');\n  handleFiles(e.dataTransfer.files);\n});\n\nfunction handleFiles(files) {\n  for (let i = 0; i < files.length; i++) selectedFiles.push(files[i]);\n  renderFileList();\n  updateAXButton();\n}\n\nfunction renderFileList() {\n  if (selectedFiles.length === 0) {\n    fileListTitle.textContent = '📂 업로드된 파일 (0개)';\n    fileList.innerHTML = '<div class=\"empty-msg\">아직 선택된 파일이 없습니다<\/div>';\n    return;\n  }\n  fileListTitle.textContent = '📂 업로드된 파일 (' + selectedFiles.length + '개)';\n  let html = '';\n  selectedFiles.forEach((file, idx) => {\n    const sizeStr = file.size > 1024 * 1024 ? (file.size / 1024 / 1024).toFixed(1) + ' MB' : (file.size / 1024).toFixed(1) + ' KB';\n    html += '<div class=\"file-row\">';\n    html += '<span class=\"file-name\">' + file.name + '<\/span>';\n    html += '<span class=\"file-size\">' + sizeStr + '<\/span>';\n    html += '<span class=\"file-status\">대기<\/span>';\n    html += '<button class=\"file-remove\" onclick=\"removeFile(' + idx + ')\" title=\"제거\">✕<\/button>';\n    html += '<\/div>';\n  });\n  fileList.innerHTML = html;\n}\n\nfunction removeFile(idx) {\n  selectedFiles.splice(idx, 1);\n  renderFileList();\n  updateAXButton();\n}\n\nfunction updateAXButton() { axStartBtn.disabled = selectedFiles.length === 0; }\nfunction hasArchiveFile() { return selectedFiles.some(f => ARCHIVE_EXTS.includes(f.name.split('.').pop().toLowerCase())); }\n\nfunction setStepState(stepNum, state) {\n  const el = document.querySelector('.mini-step[data-step=\"' + stepNum + '\"]');\n  if (!el) return;\n  el.classList.remove('active', 'done', 'skipped');\n  if (state) el.classList.add(state);\n}\n\nfunction showProgress(stepIdx, customMsg) {\n  const step = STEPS[stepIdx];\n  document.getElementById('progStepNum').textContent = step.num;\n  document.getElementById('progStepName').textContent = step.name;\n  document.getElementById('progMessage').textContent = customMsg || step.msg;\n  const fill = document.getElementById('progBarFill');\n  fill.style.width = '0%';\n  setTimeout(() => { fill.style.width = '100%'; }, 50);\n  progressBox.classList.add('show');\n  document.querySelectorAll('.file-status').forEach(s => { s.textContent = '처리 중'; });\n}\n\nfunction processStep(stepIdx, customMsg) {\n  return new Promise(resolve => {\n    const stepNum = stepIdx + 1;\n    setStepState(stepNum, 'active');\n    showProgress(stepIdx, customMsg);\n    setTimeout(() => { setStepState(stepNum, 'done'); resolve(); }, 1500);\n  });\n}\n\nfunction skipStep(stepIdx) { setStepState(stepIdx + 1, 'skipped'); }\n\nfunction renderEvaluation(result, iteration) {\n  evalIterBadge.textContent = iteration + '차';\n  let html = '';\n  CHANNELS.forEach(ch => {\n    const r = result[ch.key];\n    const cls = 'grade-' + r.grade.toLowerCase();\n    const detail = r.grade === 'A' ? '정상' : r.issues + '개 미흡';\n    html += '<div class=\"eval-card ' + cls + '\">';\n    html += '<div class=\"eval-channel\">' + ch.label + ' (' + ch.ko + ')<\/div>';\n    html += '<div class=\"eval-grade\">' + r.grade + '<\/div>';\n    html += '<div class=\"eval-detail\">' + detail + '<\/div>';\n    html += '<\/div>';\n  });\n  evalGrid.innerHTML = html;\n  if (allGradeA(result)) evalAllA.classList.add('show');\n  else evalAllA.classList.remove('show');\n  evalBox.classList.add('show');\n  scrollToElement(evalBox);\n}\n\nfunction allGradeA(result) { return CHANNELS.every(ch => result[ch.key].grade === 'A'); }\nfunction getNonAChannels(result) { return CHANNELS.filter(ch => result[ch.key].grade !== 'A'); }\nfunction countGrades(result) {\n  let b = 0, c = 0;\n  CHANNELS.forEach(ch => {\n    if (result[ch.key].grade === 'B') b++;\n    else if (result[ch.key].grade === 'C') c++;\n  });\n  return { b, c };\n}\n\nfunction showFeedbackBox(iteration) {\n  fbIterBadge.textContent = iteration + '차';\n  const counts = countGrades(evaluationResult);\n  let msg = (iteration === 1 ? '' : iteration + '차 평가 결과: ');\n  msg += 'B 등급 ' + counts.b + '개, C 등급 ' + counts.c + '개 채널이 잔존합니다.<br>';\n  msg += '<strong style=\"color:#7B1F2A;\">전체 A 등급 달성까지 보완을 반복합니다.<\/strong><br>';\n  msg += '보완 방식을 선택해 주세요.';\n  fbMessage.innerHTML = msg;\n\n  const nonA = getNonAChannels(evaluationResult);\n  let chHtml = '';\n  nonA.forEach(ch => {\n    chHtml += '<span class=\"manual-channel-tag\">' + ch.label + ' (' + evaluationResult[ch.key].grade + ')<\/span>';\n  });\n  manualChannels.innerHTML = chHtml;\n  manualBox.classList.remove('show');\n  manualText.value = '';\n  manualText.style.borderColor = '#1A237E';\n\n  document.querySelectorAll('.fb-btn').forEach(b => b.disabled = true);\n  feedbackBox.classList.add('show');\n  scrollToElement(feedbackBox);\n\n  setTimeout(() => {\n    document.querySelectorAll('.fb-btn').forEach(b => b.disabled = false);\n    isProcessing = false;\n  }, 800);\n}\n\nfunction showIterCounter(iteration) {\n  iterCounter.textContent = '🔁 평가 ↔ 보완 ' + iteration + '차 진행 중';\n  iterCounter.classList.add('show');\n}\n\nasync function showIterAlert(text, sub) {\n  iterAlertMain.textContent = text;\n  iterAlertSub.textContent = sub || '전체 A 등급 달성까지 계속됩니다';\n  iterAlert.classList.add('show');\n  scrollToElement(iterAlert);\n  await wait(1500);\n  iterAlert.classList.remove('show');\n}\n\nfunction waitForUserChoice() { return new Promise(resolve => { userChoiceResolver = resolve; }); }\n\ndocument.querySelectorAll('.fb-btn').forEach(btn => {\n  btn.addEventListener('click', () => {\n    if (isProcessing) return;\n    if (btn.disabled) return;\n    if (btn.dataset.mode === 'manual') {\n      manualBox.classList.add('show');\n      document.querySelectorAll('.fb-btn').forEach(b => b.disabled = true);\n      scrollToElement(manualBox);\n      return;\n    }\n    isProcessing = true;\n    document.querySelectorAll('.fb-btn').forEach(b => b.disabled = true);\n    if (userChoiceResolver) {\n      const r = userChoiceResolver;\n      userChoiceResolver = null;\n      r(btn.dataset.mode);\n    }\n  });\n});\n\nmanualSubmit.addEventListener('click', () => {\n  if (manualText.value.trim().length === 0) {\n    manualText.style.borderColor = '#7B1F2A';\n    manualText.placeholder = '⚠️ 내용을 입력해 주세요';\n    return;\n  }\n  if (isProcessing) return;\n  isProcessing = true;\n  if (userChoiceResolver) {\n    const r = userChoiceResolver;\n    userChoiceResolver = null;\n    r('manual');\n  }\n});\n\nasync function runFeedbackLoop() {\n  while (true) {\n    showIterCounter(currentIteration);\n    if (allGradeA(evaluationResult)) {\n      setStepState(4, 'done');\n      iterCounter.classList.remove('show');\n      return;\n    }\n    setStepState(4, 'active');\n    showFeedbackBox(currentIteration);\n    const choice = await waitForUserChoice();\n    feedbackBox.classList.remove('show');\n\n    if (choice === 'skip') {\n      showProgress(3, '보완 없이 다음 단계로 진행합니다');\n      document.getElementById('progStepName').textContent = '보완 (건너뜀)';\n      document.getElementById('progBarFill').style.width = '100%';\n      await wait(800);\n      setStepState(4, 'done');\n      iterCounter.classList.remove('show');\n      progressBox.classList.remove('show');\n      return;\n    }\n\n    const msg = choice === 'auto' ? '🤖 AI가 자동으로 보완 중입니다... (' + currentIteration + '차)' : '✍️ 직접 수정 내용 반영 중... (' + currentIteration + '차)';\n    showProgress(3, msg);\n    await wait(1500);\n    progressBox.classList.remove('show');\n\n    currentIteration++;\n    await showIterAlert(currentIteration + '차 재평가 시작', '전체 A 등급 달성까지 계속됩니다');\n\n    showProgress(2, currentIteration + '차 재평가 진행 중...');\n    setStepState(3, 'active');\n    await wait(1500);\n    setStepState(3, 'done');\n    progressBox.classList.remove('show');\n\n    const evalData = EVAL_BY_ITERATION[currentIteration] || EVAL_BY_ITERATION[3];\n    evaluationResult = JSON.parse(JSON.stringify(evalData));\n    renderEvaluation(evaluationResult, currentIteration);\n    await wait(1800);\n  }\n}\n\n// AI 학습 시각화 (v7)\nfunction initLearningBox() {\n  let stepHtml = '';\n  LEARNING_SUBSTEPS.forEach((sub, idx) => {\n    stepHtml += '<div class=\"lb-substep\" data-sub=\"' + idx + '\">';\n    stepHtml += '<div><span class=\"lb-substep-num\">' + (idx + 1) + '<\/span>';\n    stepHtml += '<span class=\"lb-substep-name\">' + sub.icon + ' ' + sub.name + '<\/span><\/div>';\n    stepHtml += '<div class=\"lb-substep-status\">대기<\/div>';\n    stepHtml += '<div class=\"lb-substep-bar\"><div class=\"lb-substep-fill\"><\/div><\/div>';\n    stepHtml += '<\/div>';\n  });\n  lbSubsteps.innerHTML = stepHtml;\n\n  let chHtml = '';\n  CHANNELS.forEach(ch => {\n    chHtml += '<div class=\"lb-channel\" data-ch=\"' + ch.key + '\">';\n    chHtml += '<div class=\"lb-ch-label\">' + ch.label + ' (' + ch.ko + ')<\/div>';\n    chHtml += '<div class=\"lb-ch-icon\">⏳<\/div>';\n    chHtml += '<div class=\"lb-ch-status\">대기<\/div>';\n    chHtml += '<\/div>';\n  });\n  lbChannels.innerHTML = chHtml;\n\n  lbStatItems.textContent = '0';\n  lbStatVectors.textContent = '0';\n  lbStatIndex.textContent = '0';\n  lbStatSpeed.textContent = '0';\n  lbProgressNum.textContent = '0%';\n  lbProgressFill.style.width = '0%';\n  lbLogContent.innerHTML = '';\n}\n\nfunction getTimeStr() {\n  const d = new Date();\n  return d.toTimeString().substring(0, 8);\n}\n\nfunction addLog(targetEl, text, type) {\n  const cls = type ? ' ' + type : '';\n  const html = '<div class=\"lb-log-line' + cls + '\">';\n  const inner = '<span class=\"lb-log-time\">[' + getTimeStr() + ']<\/span>' + text;\n  targetEl.insertAdjacentHTML('beforeend', html + inner + '<\/div>');\n  targetEl.scrollTop = targetEl.scrollHeight;\n}\n\nfunction setSubstepState(idx, state, statusText) {\n  const el = lbSubsteps.querySelector('[data-sub=\"' + idx + '\"]');\n  if (!el) return;\n  el.classList.remove('active', 'done');\n  if (state) el.classList.add(state);\n  if (statusText) el.querySelector('.lb-substep-status').textContent = statusText;\n  const fill = el.querySelector('.lb-substep-fill');\n  if (state === 'active') {\n    fill.style.width = '0%';\n    setTimeout(() => { fill.style.width = '100%'; }, 50);\n  } else if (state === 'done') {\n    fill.style.width = '100%';\n  }\n}\n\nfunction setChannelState(key, state, iconText) {\n  const el = lbChannels.querySelector('[data-ch=\"' + key + '\"]');\n  if (!el) return;\n  el.classList.remove('active', 'done');\n  if (state) el.classList.add(state);\n  if (iconText) el.querySelector('.lb-ch-icon').textContent = iconText;\n  const status = el.querySelector('.lb-ch-status');\n  if (state === 'active') status.textContent = '학습 중';\n  else if (state === 'done') status.textContent = '완료';\n  else status.textContent = '대기';\n}\n\nasync function processSubstep(idx) {\n  const sub = LEARNING_SUBSTEPS[idx];\n  setSubstepState(idx, 'active', '진행 중');\n  addLog(lbLogContent, '▶ ' + sub.icon + ' ' + sub.name + ' 시작', 'start');\n\n  const perChannelMs = sub.duration / 6;\n  for (let i = 0; i < CHANNELS.length; i++) {\n    const ch = CHANNELS[i];\n    setChannelState(ch.key, 'active', '🔄');\n    addLog(lbLogContent, '  ↳ ' + ch.label + ' (' + ch.ko + ') ' + sub.name + ' 처리 중');\n    await wait(perChannelMs);\n    setChannelState(ch.key, 'done', '✓');\n\n    const baseItems = 200 + idx * 50;\n    const baseVectors = 1200 + idx * 300;\n    const baseIndex = 5 + idx * 5;\n    const baseSpeed = 380 + idx * 20;\n    const ratio = (i + 1) / CHANNELS.length;\n\n    lbStatItems.textContent = Math.round(baseItems + 1048 * ratio).toLocaleString();\n    lbStatVectors.textContent = Math.round(baseVectors + 6288 * ratio).toLocaleString();\n    lbStatIndex.textContent = Math.round(baseIndex + 27 * ratio).toString();\n    lbStatSpeed.textContent = Math.round(baseSpeed + 70 * ratio).toString();\n  }\n\n  setSubstepState(idx, 'done', '완료');\n  addLog(lbLogContent, '✓ ' + sub.icon + ' ' + sub.name + ' 완료', 'done');\n\n  const totalProgress = Math.round(((idx + 1) / LEARNING_SUBSTEPS.length) * 100);\n  lbProgressNum.textContent = totalProgress + '%';\n  lbProgressFill.style.width = totalProgress + '%';\n\n  if (idx < LEARNING_SUBSTEPS.length - 1) {\n    await wait(400);\n    CHANNELS.forEach(ch => setChannelState(ch.key, '', '⏳'));\n  }\n}\n\nasync function runAILearning() {\n  setStepState(5, 'active');\n  initLearningBox();\n  learningBox.classList.add('show');\n  scrollToElement(learningBox);\n  await wait(500);\n  addLog(lbLogContent, '🚀 AI 학습 시작 - 파일 ' + selectedFiles.length + '개, 5W1H 6채널 데이터');\n  for (let i = 0; i < LEARNING_SUBSTEPS.length; i++) {\n    await processSubstep(i);\n  }\n  addLog(lbLogContent, '🎯 AI 학습 완료 - 모든 채널 학습 인덱스 생성', 'done');\n  setStepState(5, 'done');\n  await wait(1500);\n}\n\n// ============================================\n// [v8 신규] AX 시스템 구축 시각화\n// ============================================\nfunction initAXBuildBox() {\n  let html = '';\n  AX_MODULES.forEach(mod => {\n    html += '<div class=\"ax-module\" data-mod=\"' + mod.key + '\">';\n    html += '<div class=\"ax-module-icon\">' + mod.icon + '<\/div>';\n    html += '<div class=\"ax-module-name\">' + mod.name + '<\/div>';\n    html += '<div class=\"ax-module-desc\">' + mod.desc + '<\/div>';\n    html += '<div class=\"ax-module-status\">⏳ 대기<\/div>';\n    html += '<\/div>';\n  });\n  axModulesEl.innerHTML = html;\n\n  // 자원 정보 초기화\n  axResId.textContent = '배정 대기 중';\n  axResId.classList.add('pending');\n  axResUser.textContent = '배정 대기 중';\n  axResUser.classList.add('pending');\n  axResStorage.textContent = '활성화 대기 중';\n  axResStorage.classList.add('pending');\n  axResUrl.textContent = '활성화 대기 중';\n  axResUrl.classList.add('pending');\n\n  axProgressNum.textContent = '0%';\n  axProgressFill.style.width = '0%';\n  axLogContent.innerHTML = '';\n}\n\nfunction setAXModuleState(key, state, statusText) {\n  const el = axModulesEl.querySelector('[data-mod=\"' + key + '\"]');\n  if (!el) return;\n  el.classList.remove('active', 'done');\n  if (state) el.classList.add(state);\n  const status = el.querySelector('.ax-module-status');\n  if (statusText) status.textContent = statusText;\n  else if (state === 'active') status.textContent = '🔄 구축 중';\n  else if (state === 'done') status.textContent = '✓ 완료';\n  else status.textContent = '⏳ 대기';\n}\n\nfunction revealResource(target, value) {\n  target.classList.remove('pending');\n  target.textContent = value;\n}\n\nasync function processAXModule(idx) {\n  const mod = AX_MODULES[idx];\n  setAXModuleState(mod.key, 'active');\n  addLog(axLogContent, '▶ ' + mod.icon + ' ' + mod.name + ' 구축 시작', 'start');\n  await wait(1000);\n  setAXModuleState(mod.key, 'done');\n  addLog(axLogContent, '✓ ' + mod.icon + ' ' + mod.name + ' 구축 완료', 'done');\n\n  // 시스템 자원 정보 점진 부여\n  if (idx === 0) {\n    revealResource(axResId, SYSTEM_INFO.id);\n    addLog(axLogContent, '  🔑 시스템 ID 부여: ' + SYSTEM_INFO.id);\n  } else if (idx === 1) {\n    revealResource(axResUser, SYSTEM_INFO.user);\n    addLog(axLogContent, '  🔑 사용자 코드 부여: ' + SYSTEM_INFO.user);\n  } else if (idx === 2) {\n    revealResource(axResStorage, SYSTEM_INFO.storage);\n    addLog(axLogContent, '  🔑 저장소 활성화 완료');\n  } else if (idx === 3) {\n    revealResource(axResUrl, SYSTEM_INFO.url);\n    addLog(axLogContent, '  🔑 접속 경로 활성화 완료');\n  }\n\n  const totalProgress = Math.round(((idx + 1) / AX_MODULES.length) * 100);\n  axProgressNum.textContent = totalProgress + '%';\n  axProgressFill.style.width = totalProgress + '%';\n}\n\nasync function runAXBuild() {\n  setStepState(6, 'active');\n  initAXBuildBox();\n  axBuildBox.classList.add('show');\n  scrollToElement(axBuildBox);\n  await wait(500);\n  addLog(axLogContent, '🚀 AX 시스템 구축 시작 - 6개 자동화 모듈 생성');\n\n  for (let i = 0; i < AX_MODULES.length; i++) {\n    await processAXModule(i);\n  }\n\n  addLog(axLogContent, '🎯 AX 시스템 구축 완료 - 6개 모듈 활성화', 'done');\n  setStepState(6, 'done');\n  await wait(1200);\n}\n\n// 액션 버튼 핸들러\ndocument.querySelectorAll('.action-btn').forEach(btn => {\n  btn.addEventListener('click', () => {\n    const action = btn.dataset.action;\n    const labels = {\n      'search': '🔍 검색하기',\n      'qa': '💬 AI 질의응답',\n      'dashboard': '📊 대시보드',\n      'report': '📑 보고서'\n    };\n    alert(labels[action] + ' 화면으로 이동합니다.\\n\\n시스템 ID: ' + SYSTEM_INFO.id +\n      '\ lass=\"label\">5W1H 6채널 통합 검색 · 자연어 입력 · 채널별 필터 · 등급별 정렬<\/span>\n<\/div>\n\n<!-- 상세 모달 -->\n<div class=\"modal-backdrop\" id=\"modal\">\n  <div class=\"modal-box\">\n    <div class=\"modal-header\">\n      <h2 class=\"modal-title\" id=\"modalTitle\"><\/h2>\n      <button class=\"modal-close\" id=\"modalClose\">✕<\/button>\n    <\/div>\n\n    <div class=\"modal-info-bar\">\n      <span class=\"modal-info-item\">📂 출처: <strong id=\"modalSource\"><\/strong><\/span>\n      <span class=\"modal-info-item\">📅 등록: <strong id=\"modalDate\"><\/strong><\/span>\n      <span class=\"modal-info-item\">🏷 등급: <strong id=\"modalGrade\"><\/strong><\/span>\n      <span class=\"modal-info-item\">⭐ 관련도: <strong id=\"modalRelevance\"><\/strong><\/span>\n    <\/div>\n\n    <div class=\"modal-channels\" id=\"modalChannels\"><\/div>\n\n    <div class=\"modal-actions\">\n      <button class=\"modal-btn\" id=\"modalAskAI\">💬 AI에게 질문하기<\/button>\n      <button class=\"modal-btn primary\" id=\"modalCloseBtn\">확인<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\nconst CHANNELS = [\n  { key: 'why',   label: 'Why',   ko: '왜 (목적/이유)' },\n  { key: 'what',  label: 'What',  ko: '무엇 (대상/내용)' },\n  { key: 'when',  label: 'When',  ko: '언제 (시점/기간)' },\n  { key: 'where', label: 'Where', ko: '어디 (장소/위치)' },\n  { key: 'who',   label: 'Who',   ko: '누가 (담당/대상자)' },\n  { key: 'how',   label: 'How',   ko: '어떻게 (방법/절차)' }\n];\n\n// 샘플 데이터 (재난안전·제조공정·품질관리 혼합)\nconst SAMPLE_DATA = [\n  {\n    id: 'doc-001',\n    title: '화재 발생시 대피 경로 안내',\n    why: '비상 상황 발생시 인명 보호',\n    what: '제조동 대피 경로 매뉴얼',\n    when: '화재 감지 즉시',\n    where: '제조동 1층/2층 전 구역',\n    who: '안전관리책임자, 작업자 전원',\n    how: '비상등 경로 따라 옥외 집결지 이동',\n    grade: 'A',\n    source: '안전관리매뉴얼_v3.pdf',\n    date: '2026-04-15',\n    relevance: 96,\n    keywords: ['화재', '대피', '비상', '안전', '경로']\n  },\n  {\n    id: 'doc-002',\n    title: '제조 공정 품질 점검 절차',\n    why: '제품 품질 표준 유지',\n    what: '공정 단계별 품질 점검 항목',\n    when: '매 작업 시작 및 종료 시',\n    where: '제조 라인 1~3호기   },\n  {\n    id: 'doc-008',\n    title: '안전 교육 이수 현황',\n    why: '법정 의무 안전교육 이행',\n    what: '신규 입사자·기존 직원 안전교육 현황',\n    when: '분기별 갱신',\n    where: '본사·지사 전체',\n    who: '인사팀 + 안전관리팀 공동 관리',\n    how: '온라인 LMS 시스템 + 오프라인 실습',\n    grade: 'B',\n    source: '교육이수현황_2026Q1.xlsx',\n    date: '2026-03-31',\n    relevance: 79,\n    keywords: ['교육', '이수', '안전', '인사']\n  },\n  {\n    id: 'doc-009',\n    title: '품질 부적합 사례 분석',\n    why: '재발 방지 및 품질 향상',\n    what: '2026년 1분기 부적합 사례 12건',\n    when: '2026년 1월~3월',\n    where: '제조 라인 2호기 집중 발생',\n    who: '품질팀 + 생산팀 협업',\n    how: '근본원인 분석(RCA) 후 시정조치',\n    grade: 'C',\n    source: '부적합분석_2026Q1.docx',\n    date: '2026-04-05',\n    relevance: 76,\n    keywords: ['품질', '부적합', '분석', '시정']\n  },\n  {\n    id: 'doc-010',\n    title: '협력사 안전 점검 결과',\n    why: '협력사 안전 관리 수준 점검',\n    what: '주요 협력사 12개사 안전 점검',\n    when: '2026년 4월',\n    where: '협력사 사업장',\n    who: '본사 안전팀',\n    how: '체크리스트 기반 현장 실사',\n    grade: 'A',\n    source: '협력사점검_2026Apr.pdf',\n    date: '2026-04-18',\n    relevance: 84,\n    keywords: ['협력사', '점검', '안전', '실사']\n  }\n];\n\n// 상태\nlet activeChannelFilters = new Set(); // 빈 set = 전체 채널\nlet activeGradeFilter = 'all';\nlet activeSort = 'relevance';\nlet lastResults = [];\n\n// DOM\nconst searchInput = document.getElementById('searchInput');\nconst searchBtn = document.getElementById('searchBtn');\nconst channelFiltersEl = document.getElementById('channelFilters');\nconst gradeFiltersEl = document.getElementById('gradeFilters');\nconst sortSelect = document.getElementById('sortSelect');\nconst resultsCount = document.getElementById('resultsCount');\nconst resultsTime = document.getElementById('resultsTime');\nconst loading = document.getElementById('loading');\nconst noResults = document.getElementById('noResults');\nconst resultsList = document.getElementById('resultsList');\n\nconst modal = document.getElementById('modal');\nconst modalTitle = document.getElementById('modalTitle');\nconst modalSource = document.getElementById('modalSource');\nconst modalDate = document.getElementById('modalDate');\nconst modalGrade = document.getElementById('modalGrade');\nconst modalRelevance = document.getElementById('modalRelevance');\nconst modalChannels = document.getElementById('modalChannels');\nconst modalClose = document.getElementById('modalClose');\nconst modalCloseBtn = document.getElementById('modalCloseBtn');\nconst modalAskAI = document.getElementById('modalAskAI');\n\n// 채널 필터 초기화\nfunction initChannelFilters() {\n  let html = '<span class=\"filter-chip active\" data-channel=\"all\">전체<\/span>';\n  CHANNELS.forEach(ch => {\n    html += '<span class=\"filter-chip\" data-channel=\"' + ch.key + '\">' + ch.label + '<\/span>';\n  });\n  channelFiltersEl.innerHTML = html;\n\n  channelFiltersEl.querySelectorAll('.filter-chip').forEach(chip => {\n    chip.addEventListener('click', () => {\n      const ch = chip.dataset.channel;\n      if (ch === 'all') {\n        activeChannelFilters.clear();\n        channelFiltersEl.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));\n        chip.classList.add('active');\n      } else {\n        channelFiltersEl.querySelector('[data-channel=\"all\"]').classList.remove('active');\n        if (activeChannelFilters.has(ch)) {\n          activeChannelFilters.delete(ch);\n          chip.classList.remove('active');\n        } else {\n          activeChannelFilters.add(ch);\n          chip.classList.add('active');\n        }\n        if (activeChannelFilters.size === 0) {\n          channelFiltersEl.querySelector('[data-channel=\"all\"]').classList.add('active');\n        }\n      }\n      if (lastResults.length > 0) doSearch();\n    });\n  });\n}\n\n// 등급 필터\ngradeFiltersEl.querySelectorAll('.filter-chip').forEach(chip => {\n  chip.addEventListener('click', () => {\n    gradeFiltersEl.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));\n    chip.classList.add('active');\n    activeGradeFilter = chip.dataset.grade;\n    if (lastResults.length > 0) doSearch();\n  });\n});\n\n// 정렬\nsortSelect.addEventListener('change', () => {\n  activeSort = sortSelect.value;\n  if (lastResults.length > 0) doSearch();\n});\n\n// 빠른 검색\ndocument.querySelectorAll('.quick-search-tag').forEach(tag => {\n  tag.addEventListener('click', () => {\n    searchInput.value = tag.dataset.q;\n    doSearch();\n  });\n});\n\n// 검색 실행\nsearchBtn.addEventListener('click', doSearch);\nsearchInput.addEventListener('keypress', e => {\n  if (e.key === 'Enter') doSearch();\n});\n\nasync function doSearch() {\n  const query = searchInput.value.trim();\n\n  // 결과 초기화\n  resultsList.innerHTML = '';\n  noResults.classList.remove('show');\n  loading.classList.add('show');\n  resultsCount.textContent = '검색 중...';\n  resultsTime.textContent = '';\n\n  // 검색 시뮬레이션 (0.6초)\n  const startTime = Date.now();\n  await new Promise(r => setTimeout(r, 600));\n\n  // 필터링\n  let results = SAMPLE_DATA.slice();\n\n  if (query.length > 0) {\n    const q = query.toLowerCase();\n    results = results.filter(r => {\n      // 제목, 키워드, 모든 채널 텍스트에서 검색\n      const allText = (r.title + ' ' + r.keywords.join(' ') + ' ' +\n        CHANNELS.map(c => r[c.key]).join(' ')).toLowerCase();\n      return allText.includes(q);\n    });\n  }\n\n  // 채널 필터 (적용된 채널 중 하나라도 매치되어야 통과)\n  if (activeChannelFilters.size > 0 && query.length > 0) {\n    const q = query.toLowerCase();\n    results = results.filter(r => {\n      return Array.from(activeChannelFilters).some(ch => {\n        return r[ch].toLowerCase().includes(q);\n      });\n    });\n  }\n\n  // 등급 필터\n  if (activeGradeFilter !== 'all') {\n    results = results.filter(r => r.grade === activeGradeFilter);\n  }\n\n  // 정렬\n  if (activeSort === 'relevance') {\n    results.sort((a, b) => b.relevance - a.relevance);\n  } else if (activeSort === 'date') {\n    results.sort((a, b) => b.date.localeCompare(a.date));\n  } else if (activeSort === 'grade') {\n    const order = { 'A': 0, 'B': 1, 'C': 2 };\n    results.sort((a, b) => order[a.grade] - order[b.grade]);\n  }\n\n  const elapsed = Date.now() - startTime;\n\n  loading.classList.remove('show');\n  lastResults = results;\n\n  if (results.length === 0) {\n    resultsCount.textContent = '검색 결과 없음';\n    resultsTime.textContent = '';\n    noResults.classList.add('show');\n    return;\n  }\n\n  resultsCount.innerHTML = '<strong>' + results.length + '건<\/strong> 검색됨';\n  resultsTime.textContent = '검색 소요 ' + (elapsed / 1000).toFixed(2) + '초';\n\n  renderResults(results, query);\n}\n\nfunction renderResults(results, query) {\n  let html = '';\n  results.forEach(r => {\n    const gradeClass = r.grade === 'B' ? ' b' : (r.grade === 'C' ? ' c' : '');\n    html += '<div class=\"result-card\" data-id=\"' + r.id + '\">';\n    html += '<div class=\"result-top\">';\n    html += '<h3 class=\"result-title\">' + highlightText(r.title, query) + '<\/h3>';\n    html += '<span class=\"result-grade' + gradeClass + '\">' + r.grade + ' 등급<\/span>';\n    html += '<\/div>';\n    html += '<div class=\"result-channels\">';\n    CHANNELS.forEach(ch => {\n      html += '<div class=\"result-channel\">';\n      html += '<span class=\"result-channel-label\">' + ch.label + '<\/span>';\n      html += highlightText(r[ch.key], query);\n      html += '<\/div>';\n    });\n    html += '<\/div>';\n    html += '<div class=\"result-meta\">';\n    html += '<span class=\"result-source\">📂 ' + r.source + '<\/span>';\n    html += '<span>📅 ' + r.date + '<\/span>';\n    html += '<span class=\"result-relevance\">⭐ 관련도 ' + r.relevance + '%<\/span>';\n    html += '<\/div>';\n    html += '<\/div>';\n  });\n  resultsList.innerHTML = html;\n\n  // 카드 클릭 이벤트\n  resultsList.querySelectorAll('.result-card').forEach(card => {\n    card.addEventListener('click', () => {\n      const id = card.dataset.id;\n      const item = SAMPLE_DATA.find(d => d.id === id);\n      if (item) showDetailModal(item);\n    });\n  });\n}\n\nfunction highlightText(text, query) {\n  if (!query || query.length === 0) return escapeHtml(text);\n  const escaped = escapeHtml(text);\n  const escapedQuery = escapeHtml(query).replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n  const re = new RegExp('(' + escapedQuery + ')', 'gi');\n  return escaped.replace(re, '<mark style=\"background:#fff3a0;color:#7B1F2A;font-weight:900;padding:1px 3px;border-radius:3px;\">$1<\/mark>');\n}\n\nfunction escapeHtml(s) {\n  return s.replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;');\n}\n\n// 상세 모달\nfunction showDetailModal(item) {\n  modalTitle.textContent = item.title;\n  modalSource.textContent = item.source;\n  modalDate.textContent = item.date;\n  modalGrade.textContent = item.grade + ' 등급';\n  modalRelevance.textContent = item.relevance + '%';\n\n  let chHtml = '';\n  CHANNELS.forEach(ch => {\n    chHtml += '<div class=\"modal-channel\">';\n    chHtml += '<div class=\"modal-channel-header\">' + ch.label + ' (' + ch.ko + ')<\/div>';\n    chHtml += '<div class=\"modal-channel-content\">' + escapeHtml(item[ch.key]) + '<\/div>';\n    chHtml += '<\/div>';\n  });\n  modalChannels.innerHTML = chHtml;\n\n  modal.classList.add('show');\n}\n\nmodalClose.addEventListener('click', () => modal.classList.remove('show'));\nmodalCloseBtn.addEventListener('click', () => modal.classList.remove('show'));\nmodal.addEventListener('click', e => {\n  if (e.target === modal) modal.classList.remove('show');\n});\n\nmodalAskAI.addEventListener('click', () => {\n  alert('💬 AI 질의응답 화면으로 이동합니다.\\n\\n선택한 항목 기준으로 추가 질문 가능합니다.\\n\\n(질의응답 화면 제작 후 연결됩니다)');\n});\n\n// 하단 화면 이동\ndocument.querySelectorAll('.bottom-btn[data-nav]').forEach(btn => {\n  btn.addEventListener('click', () => {\n    const nav = btn.dataset.nav;\n    const labels = {\n      'qa': '💬 AI 질의응답',\n      'dashboard': '📊 대시보드',\n      'report': '📑 보고서'\n    };\n    alert(labels[nav] + ' 화면으로 이동합니다.\\n\\n(해당 화면 제작 후 연결됩니다)');\n  });\n});\n\n// 초기화\ninitChannelFilters();\n<\/script>\n\n<\/body>\n<\/html>\n", "qa": "< ttom-btn-icon\">🔍<\/span>검색\n    <\/button>\n    <button class=\"bottom-btn current\">\n      <span class=\"bottom-btn-icon\">💬<\/span>AI 질의응답 (현재)\n    <\/button>\n    <button class=\"bottom-btn\" data-nav=\"dashboard\">\n      <span class=\"bottom-btn-icon\">📊<\/span>대시보드\n    <\/button>\n    <button class=\"bottom-btn\" data-nav=\"report\">\n      <span class=\"bottom-btn-icon\">📑<\/span>보고서\n    <\/button>\n  <\/div>\n\n<\/section>\n\n<div class=\"file-types-bar\">\n  <span class=\"label\">자연어 대화 · 6채널 데이터 기반 · 출처 자동 표시 · 후속 질문 추천<\/span>\n<\/div>\n\n<script>\nconst CHANNELS = [\n  { key: 'why',   label: 'Why',   ko: '왜', icon: '🎯' },\n  { key: 'what',  label: 'What',  ko: '무엇', icon: '📋' },\n  { key: 'when',  label: 'When',  ko: '언제', icon: '⏰' },\n  { key: 'where', label: 'Where', ko: '어디', icon: '📍' },\n  { key: 'who',   label: 'Who',   ko: '누가', icon: '👤' },\n  { key: 'how',   label: 'How',   ko: '어떻게', icon: '🔧' }\n];\n\n// 검색 화면과 동일한 샘플 데이터\nconst SAMPLE_DATA = [\n  { id: 'doc-001', title: '화재 발생시 대피 경로 안내', why: '비상 상황 발생시 인명 보호', what: '제조동 대피 경로 매뉴얼', when: '화재 감지 즉시', where: '제조동 1층/2층 전 구역', who: '안전관리책임자, 작업자 전원', how: '비상등 경로 따라 옥외 집결지 이동', grade: 'A', source: '안전관리매뉴얼_v3.pdf', date: '2026-04-15', keywords: ['화재', '대피', '비상', '안전', '경로'] },\n  { id: 'doc-002', title: '제조 공정 품질 점검 절차', why: '제품 품질 표준 유지', what: '공정 단계별 품질 점검 항목', when: '매 작업 시작 및 종료 시', where: '제조 라인 1~3호기', who: '품질관리팀 조장', how: '점검표 기반 항목별 측정 후 기록', grade: 'A', source: '품질관리지침_v2.docx', date: '2026-04-08', keywords: ['품질', '점검', '공정', '관리', '측정'] },\n  { id: 'doc-003', title: '작업장 안전 수칙', why: '작업 중 사고 예방', what: '필수 안전 수칙 12항목', when: '모든 작업 시간', where: '전 작업장', who: '전 작업자', how: '교육 이수 후 현장 게시판 부착·준수', grade: 'A', source: '안전수칙고시_v1.pdf', date: '2026-03-22', keywords: ['안전', '수칙', '작업', '예방'] },\n  { id: 'doc-004', title: '화학물질 취급 절차', why: '화학물질 누출·오염 방지', what: '인화성·독성 화학물질 취급 매뉴얼', when: '화학물질 입출고 및 사용 시', where: '화학물질 저장고 및 작업장', who: '안전교육 이수자만 가능', how: '보호구 착용 후 지정된 절차 따라 Id('sendBtn');\nconst clearBtn = document.getElementById('clearBtn');\n\n// ============================================\n// 질문 분석 및 매칭\n// ============================================\n\nfunction findMatchingDocs(question) {\n  const q = question.toLowerCase();\n  const scored = SAMPLE_DATA.map(doc => {\n    let score = 0;\n    // 제목 매칭 (가장 강력)\n    if (doc.title.toLowerCase().includes(q)) score += 50;\n    // 키워드 매칭\n    doc.keywords.forEach(kw => {\n      if (q.includes(kw.toLowerCase())) score += 20;\n    });\n    // 6채널 텍스트 매칭\n    CHANNELS.forEach(ch => {\n      if (doc[ch.key].toLowerCase().includes(q)) score += 10;\n    });\n    // 부분 단어 매칭\n    const qWords = q.split(/\\s+/).filter(w => w.length >= 2);\n    qWords.forEach(word => {\n      if (doc.title.toLowerCase().includes(word)) score += 8;\n      doc.keywords.forEach(kw => {\n        if (kw.toLowerCase().includes(word)) score += 5;\n      });\n      CHANNELS.forEach(ch => {\n        if (doc[ch.key].toLowerCase().includes(word)) score += 3;\n      });\n    });\n    return { doc, score };\n  });\n\n  return scored\n    .filter(s => s.score > 0)\n    .sort((a, b) => b.score - a.score)\n    .map(s => s.doc);\n}\n\nfunction getQuestionType(question) {\n  const q = question.toLowerCase();\n  if (q.includes('어떻게') || q.includes('방법') || q.includes('절차')) return 'how';\n  if (q.includes('언제') || q.includes('시간') || q.includes('주기')) return 'when';\n  if (q.includes('어디') || q.includes('장소') || q.includes('위치')) return 'where';\n  if (q.includes('누가') || q.includes('담당') || q.includes('책임')) return 'who';\n  if (q.includes('왜') || q.includes('이유') || q.includes('목적')) return 'why';\n  if (q.includes('무엇') || q.includes('뭐')) return 'what';\n  return 'all';\n}\n\nfunction generateAnswer(question) {\n  const matched = findMatchingDocs(question);\n  const qType = getQuestionType(question);\n\n  if (matched.length === 0) {\n    return {\n      noMatch: true,\n      text: '죄송합니다. 학습된 데이터에서 관련 정보를 찾지 못했습니다.\\n\\n다른 방식으로 질문해 주시거나, 검색 화면에서 직접 자료를 찾아보실 수 있습니다.',\n      sources: [],\n      followups: [\n        '🛡️ 작업장 안전 수칙은 무엇인가요?',\n        '✅ 품질 점검 절차는?',\n        '🚨 응급 상황 대응은?'\n      ]\n    };\n  }\n\n  const primary = matched[0];\n  const sources = matched.slice(0, 3);\n\n  return {\n    primary: primary,\n    sources: sources,\n    qType: qType,\n    followups: generateFollowups(primary, matched)\n  };\n}\n\nfunction generateFollowups(primary, allMatched) {\n  const followups = [];\n  followups.push(primary.title + '의 상세 절차는?');\n  followups.push(primary.who + '의 연락처를 알려주세요');\n  if (allMatched.length > 1) {\n    followups.push('관련된 다른 자료는?');\n  }\n  return followups.slice(0, 3);\n}\n\n// ============================================\n// 메시지 추가\n// ============================================\n\nfunction getTimeStr() {\n  const d = new Date();\n  const h = String(d.getHours()).padStart(2, '0');\n  const m = String(d.getMinutes()).padStart(2, '0');\n  return h + ':' + m;\n}\n\nfunction addUserMessage(text) {\n  const html =\n    '<div class=\"msg user\">' +\n      '<div class=\"msg-avatar\">나<\/div>' +\n      '<div>' +\n        '<div class=\"msg-bubble\">' + escapeHtml(text) + '<\/div>' +\n        '<div class=\"msg-time\">' + getTimeStr() + '<\/div>' +\n      '<\/div>' +\n    '<\/div>';\n  chatBox.insertAdjacentHTML('beforeend', html);\n  scrollToBottom();\n}\n\nfunction addTypingIndicator() {\n  const html =\n    '<div class=\"msg ai\" id=\"typingMsg\">' +\n      '<div class=\"msg-avatar\">AI<\/div>' +\n      '<div class=\"msg-bubble\">' +\n        '<div class=\"typing\">' +\n          '<div class=\"typing-dot\"><\/div>' +\n          '<div class=\"typing-dot\"><\/div>' +\n          '<div class=\"typing-dot\"><\/div>' +\n        '<\/div>' +\n      '<\/div>' +\n    '<\/div>';\n  chatBox.insertAdjacentHTML('beforeend', html);\n  scrollToBottom();\n}\n\nfunction removeTypingIndicator() {\n  const el = document.getElementById('typingMsg');\n  if (el) el.remove();\n}\n\nfunction addAIMessage(answer) {\n  let bubbleHtml = '';\n\n  if (answer.noMatch) {\n    bubbleHtml += '<div style=\"color:#7B1F2A;font-weight:900;margin-bottom:8px;\">⚠️ 관련 정보를 찾지 못했습니다<\/div>';\n    bubbleHtml += '<div style=\"white-space:pre-line;\">' + escapeHtml(answer.text) + '<\/div>';\n  } else {\n    const p = answer.primary;\n    bubbleHtml += '<div class=\"ai-answer-title\">📌 ' + escapeHtml(p.title) + '<\/div>';\n    bubbleHtml += '<div class=\"ai-answer-channels\">';\n    CHANNELS.forEach(ch => {\n      bubbleHtml += '<div class=\"ai-channel-line\">';\n      bubbleHtml += '<span class=\"ai-channel-icon\">' + ch.icon + ' ' + ch.ko + ':<\/span>';\n      bubbleHtml += escapeHtml(p[ch.key]);\n      bubbleHtml += '<\/div>';\n    });\n    bubbleHtml += '<\/div>';\n\n    // 출처 카드\n    if (answer.sources.length > 0) {\n      bubbleHtml += '<div class=\"ai-sources\">';\n      bubbleHtml += '<div class=\"ai-sources-title\">📂 참고 자료 ' + answer.sources.length + '건<\/div>';\n      answer.sources.forEach(s => {\n        const gCls = s.grade === 'B' ? ' b' : (s.grade === 'C' ? ' c' : '');\n        bubbleHtml += '<div class=\"ai-source-item\" data-id=\"' + s.id + '\">';\n        bubbleHtml += '<span class=\"ai-source-name\">' + escapeHtml(s.source) + '<\/span>';\n        bubbleHtml += '<span class=\"ai-source-grade' + gCls + '\">' + s.grade + '<\/span>';\n        bubbleHtml += '<\/div>';\n      });\n      bubbleHtml += '<\/div>';\n    }\n  }\n\n  // 후속 질문\n  if (answer.followups && answer.followups.length > 0) {\n    bubbleHtml += '<div class=\"ai-followups\">';\n    bubbleHtml += '<div class=\"ai-followups-title\">💡 추가로 물어볼 만한 질문<\/div>';\n    answer.followups.forEach(f => {\n      bubbleHtml += '<button class=\"ai-followup-btn\" data-q=\"' + escapeHtmlAttr(f) + '\">↩ ' + escapeHtml(f) + '<\/button>';\n    });\n    bubbleHtml += '<\/div>';\n  }\n\n  // 만족도\n  if (!answer.noMatch) {\n    bubbleHtml += '<div class=\"ai-feedback\">';\n    bubbleHtml += '<span class=\"ai-feedback-label\">답변이 도움됐나요?<\/span>';\n    bubbleHtml += '<button class=\"ai-feedback-btn\" data-fb=\"up\">👍<\/button>';\n    bubbleHtml += '<button class=\"ai-feedback-btn\" data-fb=\"down\">👎<\/button>';\n    bubbleHtml += '<\/div>';\n  }\n\n  const html =\n    '<div class=\"msg ai\">' +\n      '<div class=\"msg-avatar\">AI<\/div>' +\n      '<div>' +\n        '<div class=\"msg-bubble\">' + bubbleHtml + '<\/div>' +\n        '<div class=\"msg-time\">' + getTimeStr() + '<\/div>' +\n      '<\/div>' +\n    '<\/div>';\n\n  chatBox.insertAdjacentHTML('beforeend', html);\n  scrollToBottom();\n\n  // 이벤트 바인딩\n  bindLastAIMessageEvents();\n}\n\nfunction bindLastAIMessageEvents() {\n  // 후속 질문 클릭\n  chatBox.querySelectorAll('.ai-followup-btn').forEach(btn => {\n    if (btn.dataset.bound) return;\n    btn.dataset.bound = '1';\n    btn.addEventListener('click', () => {\n      qaInput.value = btn.dataset.q;\n      sendQuestion();\n    });\n  });\n\n  // 출처 카드 클릭\n  chatBox.querySelectorAll('.ai-source-item').forEach(item => {\n    if (item.dataset.bound) return;\n    item.dataset.bound = '1';\n    item.addEventListener('click', () => {\n      const id = item.dataset.id;\n      const doc = SAMPLE_DATA.find(d => d.id === id);\n      if (doc) {\n        alert('📂 ' + doc.title + '\\n\\n전체 내용은 검색 화면에서 확인 가능합니다.\\n\\n출처: ' + doc.source + '\\n등록: ' + doc.date + '\\n등급: ' + doc.grade);\n      }\n    });\n  });\n\n  // 만족도\n  chatBox.querySelectorAll('.ai-feedback-btn').forEach(btn => {\n    if (btn.dataset.bound) return;\n    btn.dataset.bound = '1';\n    btn.addEventListener('click', () => {\n      const fb = btn.dataset.fb;\n      const parent = btn.parentElement;\n      parent.querySelectorAll('.ai-feedback-btn').forEach(b => b.classList.remove('selected', 'up', 'down'));\n      btn.classList.add('selected', fb);\n      const msg = fb === 'up' ? '✅ 피드백 감사합니다!' : '⚠️ 의견 주셔서 감사합니다. 답변 품질 개선에 반영됩니다.';\n      // 작은 토스트 효과 대신 비활성 처리만\n      btn.disabled = true;\n    });\n  });\n}\n\nfunction scrollToBottom() {\n  setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 50);\n}\n\nfunction escapeHtml(s) {\n  if (s == null) return '';\n  return String(s).replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;');\n}\n\nfunction escapeHtmlAttr(s) {\n  return escapeHtml(s).replace(/\"/g, '&quot;');\n}\n\n// ============================================\n// 질문 전송\n// ============================================\n\nasync function sendQuestion() {\n  const text = qaInput.value.trim();\n  if (text.length === 0) return;\n\n  // 환영 메시지 숨김\n  if (welcomeMsg) {\n    welcomeMsg.style.display = 'none';\n  }\n\n  qaInput.value = '';\n  qaInput.disabled = true;\n  sendBtn.disabled = true;\n\n  addUserMessage(text);\n\n  // 타이핑 인디케이터\n  addTypingIndicator();\n\n  // 답변 생성 시뮬레이션 (1.2초)\n  await new Promise(r => setTimeout(r, 1200));\n\n  removeTypingIndicator();\n\n  const answer = generateAnswer(text);\n  addAIMessage(answer);\n\n  qaInput.disabled = false;\n  sendBtn.disabled = false;\n  qaInput.focus();\n}\n\nsendBtn.addEventListener('click', sendQuestion);\nqaInput.addEventListener('keypress', e => {\n  if (e.key === 'Enter' && !e.shiftKey) {\n    e.preventDefault();\n    sendQuestion();\n  }\n});\n\n// 빠른 질문\ndocument.querySelectorAll('.welcome-quick-btn').forEach(btn => {\n  btn.addEventListener('click', () => {\n    qaInput.value = btn.dataset.q;\n    sendQuestion();\n  });\n});\n\n// 새 대화 (초기화)\nclearBtn.addEventListener('click', () => {\n  if (chatBox.querySelectorAll('.msg').length === 0) return;\n  if (!confirm('대화를 모두 초기화하시겠습니까?')) return;\n  chatBox.innerHTML = '';\n  chatBox.appendChild(welcomeMsg);\n  welcomeMsg.style.display = '';\n});\n\n// 하단 화면 이동\ndocument.querySelectorAll('.bottom-btn[data-nav]').forEach(btn => {\n  btn.addEventListener('click', () => {\n    const nav = btn.dataset.nav;\n    const labels = {\n      'search': '🔍 검색',\n      'dashboard': '📊 대시보드',\n      'report': '📑 보고서'\n    };\n    alert(labels[nav] + ' 화면으로 이동합니다.\\n\\n(해당 화면 제작 후 연결됩니다)');\n  });\n});\n<\/script>\n\n<\/body>\n<\/html>\n", "dashboard": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<title>saas.html 화면 5 v2 - 대시보드 (인터랙티브)<\/title>\n<style>\n  body { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; margin: 0; padding: 40px 20px; background: #ffffff; }\n\n  .top-banner {\n    background: #1A237E; color: #ffffff; text-align: center;\n    padding: 14px 20px; font-size: 18px; font-weight: 700; margin: 0 0 36px 0;\n  }\n\n  .dash-wrapper {\n    max-width: 1200px; margin: 0 auto 28px auto;\n    border: 3px solid #1A237E; border-radius: 16px;\n    padding: 36px 40px; background: #ffffff; box-sizing: border-box;\n  }\n\n  /* 상단 영역: 시스템 정보 + 액션 버튼 */\n  .dash-top {\n    display: flex; gap: 14px; margin: 0 0 20px 0;\n  }\n\n  .sys-header {\n    flex-grow: 1;\n    background: #f5f7ff; border: 2px solid #1A237E;\n    border-radius: 10px; padding: 12px 20px;\n    font-size: 14px; font-weight: 700; color: #000000;\n    display: flex; gap: 20px; flex-wrap: wrap; align-items: center;\n  }\n  .sys-info-label { color: #555; margin-right: 6px; }\n  .sys-info-value { color: #1A237E; font-family: 'Courier New', monospace; font-weight: 900; }\n\n  .dash-actions {\n    display: flex; gap: 8px;\n  }\n\n  .action-icon-btn {\n    background: #ffffff; color: #1A237E;\n    border: 2px solid #1A237E;\n    font-size: 14px; font-weight: 900;\n    padding: 10px 16px; border-radius: 10px;\n    cursor: pointer; white-space: nowrap;\n    transition: all 0.2s;\n  }\n\n  .action-icon-btn:hover {\n    background: #1A237E; color: #ffffff;\n    transform: translateY(-2px);\n  }\n\n  .screen-title {\n    color: #1A237E; font-size: 36px; font-weight: 900;\n    text-align: center; margin: 0 0 14px 0;\n  }\n  .screen-subtitle {\n    color: #000000; font-size: 18px; font-weight: 700;\n    text-align: center; margin: 0 0 24px 0;\n  }\n\n  /* 탭 + 기간 필터 */\n  .dash-controls {\n    display: flex; justify-content: space-between;\n    al 고서', primary: true, action: () => alert('📄 PDF 보고서가 생성됩니다.\\n시스템: AX-2026-0508\\n기간: 최근 7일') },\n      { label: 'Excel 데이터', action: () => alert('📊 Excel 데이터가 생성됩니다.') },\n      { label: 'CSV 원본', action: () => alert('📑 CSV 원본 데이터가 생성됩니다.') }\n    ]);\n});\n\ndocument.getElementById('btnSettings').addEventListener('click', () => {\n  showSimpleAlert('⚙️ 설정', '<p>대시보드 환경설정 화면입니다.<\/p><ul style=\"margin-left:20px;\"><li>알림 환경설정<\/li><li>차트 표시 옵션<\/li><li>자동 갱신 주기<\/li><li>접근 권한 관리<\/li><\/ul>');\n});\n\n// KPI 카드 클릭\ndocument.querySelectorAll('.kpi-card').forEach(card => {\n  card.addEventListener('click', () => {\n    const kpi = card.dataset.kpi;\n    const details = {\n      'data': {\n        title: '📚 총 학습 데이터 상세',\n        body: '<p>현재 학습된 총 데이터: <strong>1,248개<\/strong><\/p>' +\n              '<p>전주 대비 증가: <strong>+84개 (+7.2%)<\/strong><\/p>' +\n              '<h4 style=\"margin-top:16px;color:#1A237E;\">분야별 분포<\/h4>' +\n              '<ul style=\"margin-left:20px;\"><li>안전 관리: 380개<\/li><li>품질 관리: 312개<\/li><li>설비 관리: 198개<\/li><li>응급 대응: 142개<\/li><li>교육·훈련: 128개<\/li><li>기타: 88개<\/li><\/ul>'\n      },\n      'grade': {\n        title: '✅ A 등급 비율 상세',\n        body: '<p>전체 A 등급 비율: <strong>78%<\/strong><\/p>' +\n              '<p>전주 대비 증가: <strong>+5%<\/strong><\/p>' +\n              '<h4 style=\"margin-top:16px;color:#1A237E;\">등급별 데이터<\/h4>' +\n              '<ul style=\"margin-left:20px;\"><li>A 등급: 974개 (78%)<\/li><li>B 등급: 175개 (14%)<\/li><li>C 등급: 99개 (8%)<\/li><\/ul>' +\n              '<p style=\"margin-top:12px;\">증가 원인: <strong>2차·3차 자동 보완<\/strong>으로 B/C 등급이 A로 개선됨<\/p>'\n      },\n      'response': {\n        title: '⚡ 평균 응답 시간 상세',\n        body: '<p>평균 응답 시간: <strong>0.82초<\/strong><\/p>' +\n              '<p>전주 대비 개선: <strong>-0.18초<\/strong><\/p>' +\n              '<h4 style=\"margin-top:16px;color:#1A237E;\">유형별 응답<\/h4>' +\n              '<ul style=\"margin-left:20px;\"><li>검색: 0.65초<\/li><li>질의응답: 1.12초<\/li><li>보고서 생성: 2.34초<\/li><\/ul>' +\n              '<p style=\"margin-top:12px;\">개선 요인: <strong>인덱스 최적화 + 캐시 적용<\/strong><\/p>'\n      },\n      'users': {\n        title: '👥 일일 사용자 상세',\n        body: '<p>오늘 일일 사용자: <strong>28명<\/strong><\/p>' +\n              '<p>전주 대비 증가: <strong>+12% (+3명)<\/strong><\/p>' +\n              '<h4 style=\"margin-top:16px;color:#1A237E;\">활동 분포<\/h4>' +\n              '<ul style=\"margin-left:20px;\"><li>활성 사용자: 18명 (방금~5분 이내)<\/li><li>최근 사용자: 7명 (1시간 이내)<\/li><li>대기 중: 3명 (3시간 이상)<\/li><\/ul>'\n      }\n    };\n    const d = details[kpi];\n    if (d) showSimpleAlert(d.title, d.body);\n  });\n});\n\n// 6채널 막대 클릭\nfunction renderChannelChart() {\n  const el = document.getElementById('channelBarChart');\n  let html = '';\n  CHANNELS.forEach(ch => {\n    const g = CHANNEL_GRADES[ch.key];\n    const aPct = (g.a / g.total) * 100;\n    const bPct = (g.b / g.total) * 100;\n    const cPct = (g.c / g.total) * 100;\n    html += '<div class=\"bar-row\" data-ch=\"' + ch.key + '\">';\n    html += '<div class=\"bar-label\">' + ch.label + ' (' + ch.ko + ')<\/div>';\n    html += '<div class=\"bar-track\">';\n    html += '<div class=\"bar-segment a\" style=\"width:' + aPct + '%;\"><\/div>';\n    html += '<div class=\"bar-segment b\" style=\"width:' + bPct + '%;\"><\/div>';\n    html += '<div class=\"bar-segment c\" style=\"width:' + cPct + '%;\"><\/div>';\n    html += '<\/div>';\n    html += '<div class=\"bar-value\">' + g.total + '<\/div>';\n    html += '<\/div>';\n  });\n  el.innerHTML = html;\n  el.querySelectorAll('.bar-row').forEach(row => {\n    row.addEventListener('click', () => {\n      const chKey = row.dataset.ch;\n      const ch = CHANNELS.find(c => c.key === chKey);\n      const g = CHANNEL_GRADES[chKey];\n      showSimpleAlert(ch.icon + ' ' + ch.label + ' (' + ch.ko + ') 채널 상세',\n        '<p>총 데이터: <strong>' + g.total + '개<\/strong><\/p>' +\n        '<ul style=\"margin-left:20px;\"><li>A 등급: ' + g.a + '개 (' + ((g.a/g.total)*100).toFixed(1) + '%)<\/li><li>B 등급: ' + g.b + '개 (' + ((g.b/g.total)*100).toFixed(1) + '%)<\/li><li>C 등급: ' + g.c + '개 (' + ((g.c/g.total)*100).toFixed(1) + '%)<\/li><\/ul>' +\n        (g.b + g.c > 0 ? '<p style=\"margin-top:12px;color:#7B1F2A;font-weight:900;\">⚠️ 미흡 항목 ' + (g.b + g.c) + '개 - 보완 권장<\/p>' : ''));\n    });\n  });\n}\n\nfunction renderCategoryChart() {\n  const el = document.getElementById('categoryBarChart');\n  const max = Math.max.apply(null, CATEGORIES.map(c => c.count));\n  let html = '';\n  CATEGORIES.forEach(cat => {\n    const pct = (cat.count / max) * 100;\n    html += '<div class=\"bar-row\" data-cat=\"' + cat.name + '\">';\n    html += '<div class=\"bar-label\">' + cat.name + '<\/div>';\n    html += '<div class=\"bar-track\"><div class=\"bar-segment solid\" style=\"width:' + pct + '%;\"><\/div><\/div>';\n    html += '<div class=\"bar-value\">' + cat.count + '<\/div>';\n    html += '<\/div>';\n  });\n  el.innerHTML = html;\n}\n\nfunction renderActivityLog() {\n  const el = document.getElementById('activityLog');\n  let html = '';\n  ACTIVITIES.forEach((a, idx) => {\n    html += '<div class=\"activity-row\" data-act=\"' + idx + '\">';\n    html += '<div class=\"activity-time\">' + a.time + '<\/div>';\n    html += '<div class=\"activity-icon\">' + a.icon + '<\/div>';\n    html += '<div class=\"activity-text\">' + a.text + '<\/div>';\n    html += '<div class=\"activity-tag\">' + a.tag + '<\/div>';\n    html += '<\/div>';\n  });\n  el.innerHTML = html;\n  el.querySelectorAll('.activity-row').forEach(row => {\n    row.addEventListener('click', () => {\n      const a = ACTIVITIES[row.dataset.act];\n      showSimpleAlert('📋 활동 상세 - ' + a.tag,\n        '<p>시각: <strong>' + a.time + '<\/strong><\/p>' +\n        '<p>활동: <strong>' + a.text.replace(/<[^>]+>/g, '') + '<\/strong><\/p>' +\n        '<p>분류: <strong>' + a.tag + '<\/strong><\/p>' +\n        '<p style=\"margin-top:12px;color:#555;\">상세 로그를 확인하려면 시스템 탭으로 이동하세요.<\/p>');\n    });\n  });\n}\n\n// 도넛 통계 클릭\ndocument.querySelectorAll('.donut-stat d-grade\">' + dominantGrade + '<\/div>';\n    html += '<\/div>';\n    html += '<div class=\"channel-mini-bar\">';\n    html += '<div class=\"bar-segment a\" style=\"width:' + aPct + '%;\"><\/div>';\n    html += '<div class=\"bar-segment b\" style=\"width:' + bPct + '%;\"><\/div>';\n    html += '<div class=\"bar-segment c\" style=\"width:' + cPct + '%;\"><\/div>';\n    html += '<\/div>';\n    html += '<div class=\"channel-card-stats\">';\n    html += '<div class=\"channel-stat\"><div class=\"channel-stat-value\">' + g.a + '<\/div><div class=\"channel-stat-label\">A 등급<\/div><\/div>';\n    html += '<div class=\"channel-stat\"><div class=\"channel-stat-value\">' + (g.b + g.c) + '<\/div><div class=\"channel-stat-label\">미흡 (B+C)<\/div><\/div>';\n    html += '<\/div>';\n    html += '<div class=\"channel-card-foot\">' + ((g.a/g.total)*100).toFixed(1) + '% 정상 · 클릭하여 보완 작업<\/div>';\n    html += '<\/div>';\n  });\n  el.innerHTML = html;\n  el.querySelectorAll('.channel-card').forEach(c => {\n    c.addEventListener('click', () => {\n      const ch = CHANNELS.find(x => x.key === c.dataset.ch);\n      const g = CHANNEL_GRADES[c.dataset.ch];\n      const total = g.b + g.c;\n      if (total === 0) {\n        showSimpleAlert('✅ ' + ch.label + ' (' + ch.ko + ') 채널',\n          '<p>모든 데이터 <strong>A 등급<\/strong>입니다.<\/p><p>추가 보완이 필요하지 않습니다.<\/p>');\n      } else {\n        showModal(ch.icon + ' ' + ch.label + ' (' + ch.ko + ') 보완',\n          '<p>미흡 데이터 <strong>' + total + '개<\/strong> (B: ' + g.b + ', C: ' + g.c + ')<\/p><p>자동 보완을 실행하시겠습니까?<\/p>',\n          [\n            { label: '🤖 자동 보완 실행', primary: true, action: () => alert('자동 보완을 시작합니다.\\n예상 소요: ' + (total * 0.3).toFixed(1) + '초') },\n            { label: '✍️ 직접 수정', action: () => alert('직접 수정 화면으로 이동합니다.') },\n            { label: '취소', action: () => {} }\n          ]);\n      }\n    });\n  });\n}\nrenderChannelDetailGrid();\n\n// 사용자 행 클릭\ndocument.querySelectorAll('.user-row').forEach(row => {\n  if (row.classList.contains('header')) return;\n  row.addEventListener('click', () => {\n    const id = row.dataset.user;\n    const name = row.querySelector('.user-name').textContent;\n    showSimpleAlert('👤 사용자 상세 - ' + name,\n      '<p>사용자 ID: <strong>' + id + '<\/strong><\/p>' +\n      '<p>이름: <strong>' + name + '<\/strong><\/p>' +\n      '<p>최근 활동을 확인하거나 권한을 관리할 수 있습니다.<\/p>');\n  });\n});\n\n// 데이터 탭\nlet dataGradeFilter = 'all';\nlet dataSearchQuery = '';\n\nfunction renderDataTable() {\n  const el = document.getElementById('dataTable');\n  let filtered = SAMPLE_DATA.slice();\n  if (dataGradeFilter !== 'all') filtered = filtered.filter(d => d.grade === dataGradeFilter);\n  if (dataSearchQuery.length > 0) {\n    const q = dataSearchQuery.toLowerCase();\n    filtered = filtered.filter(d => d.title.toLowerCase().includes(q) || d.source.toLowerCase().includes(q));\n  }\n\n  let html = '<div class=\"data-row header\">' +\n    '<div><\/div>' +\n    '<div>제목 / 출처<\/div>' +\n    '<div>등록일<\/div>' +\n    '<div>등급<\/div>' +\n    '<div>작업<\/div>' +\n    '<\/div>';\n\n  if (filtered.length === 0) {\n    html += '<div class=\"empty-state\"><div class=\"empty-icon\">🔍<\/div>일치하는 데이터가 없습니다<\/div>';\n  } else {\n    filtered.forEach(d => {\n      const gCls = d.grade === 'B' ? 'b' : (d.grade === 'C' ? 'c' : 'a');\n      html += '<div class=\"data-row\" data-id=\"' + d.id + '\">';\n      html += '<input type=\"checkbox\" class=\"data-checkbox\">';\n      html += '<div><div class=\"data-title\">' + d.title + '<\/div><div class=\"data-source\">' + d.source + '<\/div><\/div>';\n      html += '<div>' + d.date + '<\/div>';\n      html += '<div><span class=\"data-grade-tag ' + gCls + '\">' + d.grade + '<\/span><\/div>';\n      html += '<div><button class=\"action-icon-btn\" style=\"padding:6px 10px;font-size:12px;\">상세<\/button><\/div>';\n      html += '<\/div>';\n    });\n  }\n  el.innerHTML = html;\n  el.querySelectorAll('.data-checkbox, .action-icon-btn').forEach(c => {\n    c.addEventListener('click', e => e.stopPropagation());\n  });\n}\n\ndocument.getElementById('dataSearch').addEventListener('input', e => {\n  dataSearchQuery = e.target.value;\n  renderDataTable();\n});\n\ndocument.querySelectorAll('.data-filter-btn').forEach(btn => {\n  btn.addEventListener('click', () => {\n    dataGradeFilter = btn.dataset.gradeFilter;\n    document.querySelectorAll('.data-filter-btn').forEach(b => b.style.background = '');\n    document.querySelectorAll('.data-filter-btn').forEach(b => b.style.color = '');\n    btn.style.background = '#1A237E';\n    btn.style.color = '#ffffff';\n    renderDataTable();\n  });\n});\n\n// 모달\nconst modal = document.getElementById('modal');\nconst modalTitle = document.getElementById('modalTitle');\nconst modalBody = document.getElementById('modalBody');\nconst modalActions = document.getElementById('modalActions');\n\nfunction showSimpleAlert(title, bodyHtml) {\n  showModal(title, bodyHtml, [{ label: '확인', primary: true, action: () => {} }]);\n}\n\nfunction showModal(title, bodyHtml, actions) {\n  modalTitle.textContent = title;\n  modalBody.innerHTML = bodyHtml;\n  modalActions.innerHTML = '';\n  (actions || []).forEach((a, idx) => {\n    const btn = document.createElement('button');\n    btn.className = 'modal-btn' + (a.primary ? ' primary' : '');\n    btn.textContent = a.label;\n    btn.addEventListener('click', () => {\n      modal.classList.remove('show');\n      if (a.action) a.action();\n    });\n    modalActions.appendChild(btn);\n  });\n  modal.classList.add('show');\n}\n\ndocument.getElementById('modalClose').addEventListener('click', () => modal.classList.remove('show'));\nmodal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });\n\n// 갱신 시각\nfunction updateTime() {\n  const d = new Date();\n  document.getElementById('updateTime').textContent =\n    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');\n}\n\n// 하
