heck-item-label\">요약<\/span><\/div>\n        <div class=\"check-item checked\" data-sec=\"kpi\"><span class=\"check-item-icon\">📈<\/span><span class=\"check-item-label\">핵심 지표 (KPI)<\/span><\/div>\n        <div class=\"check-item checked\" data-sec=\"channel\"><span class=\"check-item-icon\">🔗<\/span><span class=\"check-item-label\">6채널 분석<\/span><\/div>\n        <div class=\"check-item checked\" data-sec=\"trend\"><span class=\"check-item-icon\">📉<\/span><span class=\"check-item-label\">추이 분석<\/span><\/div>\n        <div class=\"check-item checked\" data-sec=\"activity\"><span class=\"check-item-icon\">📝<\/span><span class=\"check-item-label\">활동 로그<\/span><\/div>\n        <div class=\"check-item checked\" data-sec=\"rec\"><span class=\"check-item-icon\">💡<\/span><span class=\"check-item-label\">권고사항<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"save-options-card\">\n    <div class=\"save-options-title\">💾 저장 옵션<\/div>\n    <div class=\"filename-row\">\n      <span class=\"filename-label\">파일명:<\/span>\n      <input type=\"text\" class=\"filename-input\" id=\"customFileName\" placeholder=\"자동 생성됨\" value=\"\">\n      <span class=\"filename-ext\" id=\"fileExt\">.pdf<\/span>\n    <\/div>\n    <div class=\"save-method-row\">\n      <div class=\"save-method-card active\" data-method=\"picker\" id=\"methodPicker\">\n        <div class=\"save-method-header\"><span class=\"save-method-icon\">📁<\/span><span class=\"save-method-name\">위치 직접 선택<\/span><\/div>\n        <div class=\"save-method-desc\">파일 다이얼로그를 열어 저장 폴더와 파일명을 직접 지정합니다.<\/div>\n      <\/div>\n      <div class=\"save-method-card\" data-method=\"default\" id=\"methodDefault\">\n        <div class=\"save-method-header\"><span class=\"save-method-icon\">⚡<\/span><span class=\"save-method-name\">빠른 다운로드<\/span><\/div>\n        <div class=\"save-method-desc\">브라우저 기본 다운로드 폴더에 즉시 저장됩니다.<\/div>\n      <\/div>\n    <\/div>\n    <div id=\"browserSupportNote\" style=\"margin-top:10px;font-size:12px;font-weight:700;color:#7B1F2A;display:none;\">\n      ⚠️ 이 브라우저는 위치 직접 선택을 지원하지 않습니다 (Firefox/Safari). Chrome/Edge에서 사용 가능합니다.\n    <\/div>\n  <\/div>\n\n  <div class=\"section-title\">👁️ 보고서 미리보기 (실시간)<\/div>\n  <div class=\"preview-card\">\n    <div class=\"preview-paper\" id=\"previewPaper\"><\/div>\n  <\/div>\n\n  <button class=\"generate-btn\" id=\"generateBtn\">📑 보고서 자동 생성 →<\/button>\n\n  <div class=\"gen-progress\" id=\"genProgress\">\n    <div class=\"gen-spinner\"><\/div>\n    <div class=\"gen-text\" id=\"genText\">보고서 생성 중...<\/div>\n    <div class=\"gen-sub\" id=\"genSub\">데이터 수집 → 분석 → 작성<\/div>\n  <\/div>\n\n  <div class=\"section-title\">📂 최근 생성된 보고서<\/div>\n  <div class=\"recent-table\" id=\"recentTable\"><\/div>\n\n  <div class=\"bottom-actions\">\n    <button class=\"bottom-btn\" data-nav=\"search\"><span class=\"bottom-btn-icon\">🔍<\/span>검색<\/button>\n    <button class=\"bottom-btn\" data-nav=\"qa\"><span class=\"bottom-btn-icon\">💬<\/span>AI 질의응답<\/button>\n    <button class=\"bottom-btn\" data-nav=\"dashboard\"><span class=\"bottom-btn-icon\">📊<\/span>대시보드<\/button>\n    <button class=\"bottom-btn current\"><span class=\"bottom-btn-icon\">📑<\/span>보고서 (현재)<\/button>\n  <\/div>\n<\/section>\n\n<div class=\"file-types-bar\">\n  <span class=\"label\">진짜 PDF/Word/PowerPoint 파일 생성 · 위치 선택 저장 · 실시간 미리보기<\/span>\n<\/div>\n\n<div class=\"modal-backdrop\" id=\"modal\">\n  <div class=\"modal-box\">\n    <div class=\"modal-icon\">🎯<\/div>\n    <div class=\"modal-title\" id=\"modalTitle\">보고서 생성 완료!<\/div>\n    <div class=\"modal-msg\" id=\"modalMsg\"><\/div>\n    <div class=\"modal-info\" id=\"modalInfo\"><\/div>\n    <div class=\"modal-actions\">\n      <button class=\"modal-btn\" id=\"modalPreview\">👁️ 미리보기<\/button>\n      <button class=\"modal-btn\" id=\"modalSavePicker\">📁 위치 선택 저장<\/button>\n      <button class=\"modal-btn primary\" id=\"modalSaveDefault\">⚡ 빠른 다운로드<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"toast\" id=\"toast\"><span id=\"toastIcon\">✅<\/span><span id=\"toastText\">저장 완료<\/span><\/div>\n\n<script>\nconst TEMPLATES = {\n  'daily':     { name: '일일 보고서', period: '하루' },\n  'weekly':    { name: '주간 보고서', period: '7일' },\n  'monthly':   { name: '월간 보고서', period: '30일' },\n  'quarterly': { name: '분기 보고서', period: '90일' },\n  'custom':    { name: '사용자 정의 보고서', period: '사용자 지정' }\n};\n\nconst FORMAT_INFO = {\n  'pdf':  { name: 'PDF', ext: '.pdf', icon: '📄', mime: 'application/pdf' },\n  'docx': { name: 'Word', ext: '.docx', icon: '📝', mime: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' },\n  'pptx': { name: 'PowerPoint', ext: '.pptx', icon: '📊', mime: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' }\n};\n\nconst CHANNELS = [\n  { key: 'why', label: 'Why', ko: '왜' },\n  { key: 'what', label: 'What', ko: '무엇' },\n  { key: 'when', label: 'When', ko: '언제' },\n  { key: 'where', label: 'Where', ko: '어디' },\n  { key: 'who', label: 'Who', ko: '누가' },\n  { key: 'how', label: 'How', ko: '어떻게' }\n];\n\nconst CHANNEL_GRADES = {\n  why: { a: 230, b: 12, c: 0, total: 242 },\n  what: { a: 240, b: 8, c: 0, total: 248 },\n  when: { a: 195, b: 38, c: 9, total: 242 },\n  where: { a: 220, b: 18, c: 4, total: 242 },\n  who: { a: 168, b: 52, c: 22, total: 242 },\n  how: { a: 215, b: 22, c: 5, total: 242 }\n};\n\nconst RECENT_REPORTS = [\n  { icon: '📄', title: '주간 안전 운영 보고서', period: '4/29 ~ 5/05', format: 'PDF', status: '완료', time: '5/06 09:10' },\n  { icon: '📝', title: '4월 월간 품질 보고서', period: '4/01 ~ 4/30', format: 'DOCX', status: '완료', time: '5/01 14:25' },\n  { icon: '📊', title: '1분기 종합 보고서', period: '1/01 ~ 3/31', format: 'PPTX', status: '완료', time: '4/02 16:48' }\n];\n\nlet selectedTemplate = 'daily';\nlet selectedFormat = 'pdf';\nlet selectedSaveMethod = 'picker';\nlet selectedCategories = new Set(['safety', 'quality', 'facility', 'emergency']);\nlet selectedSections = new Set(['summary', 'kpi', 'channel', 'trend', 'activity', 'rec']);\nlet dateFrom = '';\nlet dateTo = '';\n\nconst supportsFilePicker = 'showSaveFilePicker' in window;\nif (!supportsFilePicker) {\n  document.getElementById('browserSupportNote').style.display = 'block';\n  document.getElementById('methodPicker').classList.add('disabled');\n  document.getElementById('methodPicker').classList.remove('active');\n  document.getElementById('methodDefault').classList.add('active');\n  selectedSaveMethod = 'default';\n}\n\n// 라이브러리 로드 확인\nfunction checkLibraries() {\n  const status = document.getElementById('libStatus');\n  const ok = [];\n  const missing = [];\n\n  if (window.jspdf && window.jspdf.jsPDF) ok.push('PDF'); else missing.push('PDF');\n  if (window.html2canvas) ok.push('html2canvas'); else missing.push('html2canvas');\n  if (window.PptxGenJS) ok.push('PPTX'); else missing.push('PPTX');\n  if (window.JSZip) ok.push('DOCX'); else missing.push('DOCX');\n\n  if (missing.length === 0) {\n    status.textContent = '✅ 모든 라이브러리 로드 완료';\n    status.classList.remove('error');\n  } else {\n    status.textContent = '⚠️ 미로드: ' + missing.join(', ');\n    status.classList.add('error');\n  }\n}\nwindow.addEventListener('load', () => setTimeout(checkLibraries, 500));\n\nfunction setTodayDates() {\n  const today = new Date();\n  document.getElementById('todayDate').textContent = '📅 ' + formatDate(today);\n  const weekAgo = new Date(today);\n  weekAgo.setDate(weekAgo.getDate() - 6);\n  document.getElementById('dateFrom').value = formatDate(weekAgo);\n  document.getElementById('dateTo').value = formatDate(today);\n  dateFrom = formatDate(weekAgo);\n  dateTo = formatDate(today);\n}\n\nfunction formatDate(d) {\n  const y = d.getFullYear();\n  const m = String(d.getMonth() + 1).padStart(2, '0');\n  const dd = String(d.getDate()).padStart(2, '0');\n  return y + '-' + m + '-' + dd;\n}\n\nfunction formatPeriod() {\n  return dateFrom && dateTo ? dateFrom + ' ~ ' + dateTo : '기간 미설정';\n}\n\nfunction generateAutoFileName() {\n  const tpl = TEMPLATES[selectedTemplate];\n  const dateStr = dateTo ? dateTo.replace(/-/g, '') : formatDate(new Date()).replace(/-/g, '');\n  return tpl.name.replace(/ /g, '_') + '_' + dateStr;\n}\n\nfunction getFinalFileName() {\n  const custom = document.getElementById('customFileName').value.trim();\n  const baseName = custom.length > 0 ? custom : generateAutoFileName();\n  return baseName + FORMAT_INFO[selectedFormat].ext;\n}\n\ndocument.querySelectorAll('.template-card').forEach(card => {\n  card.addEventListener('click', () => {\n    document.querySelectorAll('.template-card').forEach(c => c.classList.remove('active'));\n    card.classList.add('active');\n    selectedTemplate = card.dataset.tpl;\n    const today = new Date();\n    let from = new Date(today);\n    if (selectedTemplate === 'weekly') from.setDate(from.getDate() - 6);\n    else if (selectedTemplate === 'monthly') from.setDate(from.getDate() - 29);\n    else if (selectedTemplate === 'quarterly') from.setDate(from.getDate() - 89);\n    document.getElementById('dateFrom').value = formatDate(from);\n    document.getElementById('dateTo').value = formatDate(today);\n    dateFrom = formatDate(from);\n    dateTo = formatDate(today);\n    document.getElementById('customFileName').placeholder = generateAutoFileName();\n    renderPreview();\n  });\n});\n\ndocument.querySelectorAll('.period-quick-btn').forEach(btn => {\n  btn.addEventListener('click', () => {\n    document.querySelectorAll('.period-quick-btn').forEach(b => b.classList.remove('active'));\n    btn.classList.add('active');\n    const today = new Date();\n    let from = new Date(today);\n    const q = btn.dataset.quick;\n    if (q === '7d') from.setDate(from.getDate() - 6);\n    else if (q === '30d') from.setDate(from.getDate() - 29);\n    else if (q === 'quarter') {\n      const month = today.getMonth();\n      const qStart = Math.floor(month / 3) * 3;\n      from = new Date(today.getFullYear(), qStart, 1);\n    }\n    document.getElementById('dateFrom').value = formatDate(from);\n    document.getElementById('dateTo').value = formatDate(today);\n    dateFrom = formatDate(from);\n    dateTo = formatDate(today);\n    renderPreview();\n  });\n});\n\ndocument.getElementById('dateFrom').addEventListener('change', e => { dateFrom = e.target.value; renderPreview(); });\ndocument.getElementById('dateTo').addEventListener('change', e => { dateTo = e.target.value; renderPreview(); });\n\ndocument.querySelectorAll('.format-card').forEach(card => {\n  card.addEventListener('click', () => {\n    document.querySelectorAll('.format-card').forEach(c => c.classList.remove('active'));\n    card.classList.add('active');\n    selectedFormat = card.dataset.format;\n    document.getElementById('fileExt').textContent = FORMAT_INFO[selectedFormat].ext;\n  });\n});\n\ndocument.querySelectorAll('.save-method-card').forEach(card => {\n  card.addEventListener('click', () => {\n    if (card.classList.contains('disabled')) return;\n    document.querySelectorAll('.save-method-card').forEach(c => c.classList.remove('active'));\n    card.classList.add('active');\n    selectedSaveMethod = card.dataset.method;\n  });\n});\n\ndocument.querySelectorAll('#categoryChecks .check-item').forEach(item => {\n  item.addEventListener('click', () => {\n    item.classList.toggle('checked');\n    if (item.classList.contains('checked')) selectedCategories.add(item.dataset.cat);\n    else selectedCategories.delete(item.dataset.cat);\n    renderPreview();\n  });\n});\n\ndocument.querySelectorAll('#sectionChecks .check-item').forEach(item => {\n  item.addEventListener('click', () => {\n    item.classList.toggle('checked');\n    if (item.classList.contains('checked')) selectedSections.add(item.dataset.sec);\n    else selectedSections.delete(item.dataset.sec);\n    renderPreview();\n  });\n});\n\nfunction renderPreview() {\n  const tpl = TEMPLATES[selectedTemplate];\n  let html = '';\n  html += '<div class=\"preview-cover\">';\n  html += '<div class=\"preview-stamp\">AX-2026-0508 자동 생성<\/div>';\n  html += '<h1 class=\"preview-title\">' + tpl.name + '<\/h1>';\n  html += '<div class=\"preview-period\">대상 기간: ' + formatPeriod() + '<\/div>';\n  html += '<div class=\"preview-meta\"><span>📅 ' + formatDate(new Date()) + ' 발행<\/span><span>👤 AX-00000<\/span><span>📦 ' + FORMAT_INFO[selectedFormat].name + '<\/span><\/div>';\n  html += '<\/div>';\n\n  if (selectedSections.has('summary')) {\n    html += '<div class=\"preview-section\"><div class=\"preview-section-title\">1. 요약<\/div>';\n    html += '<p style=\"font-size:12px;line-height:1.7;color:#000;\">본 보고서는 ' + tpl.period + ' 동안의 AX 시스템 운영 현황 종합 분석입니다. 총 <strong>1,248개<\/strong> 데이터 학습, A 등급 비율 <strong>78%<\/strong>로 안정적 운영. <strong>Who(누가)<\/strong> 채널 미흡 사항 개선 권장.<\/p>';\n    html += '<\/div>';\n  }\n  if (selectedSections.has('kpi')) {\n    html += '<div class=\"preview-section\"><div class=\"preview-section-title\">2. 핵심 지표<\/div>';\n    html += '<div class=\"preview-kpi\">';\n    html += '<div class=\"preview-kpi-card\"><div class=\"preview-kpi-value\">1,248<\/div><div class=\"preview-kpi-label\">총 데이터<\/div><\/div>';\n    html += '<div class=\"preview-kpi-card\"><div class=\"preview-kpi-value\">78%<\/div><div class=\"preview-kpi-label\">A 등급<\/div><\/div>';\n    html += '<div class=\"preview-kpi-card\"><div class=\"preview-kpi-value\">0.82s<\/div><div class=\"preview-kpi-label\">평균 응답<\/div><\/div>';\n    html += '<div class=\"preview-kpi-card\"><div class=\"preview-kpi-value\">28명<\/div><div class=\"preview-kpi-label\">사용자<\/div><\/div>';\n    html += '<\/div><\/div>';\n  }\n  if (selectedSections.has('channel')) {\n    html += '<div class=\"preview-section\"><div class=\"preview-section-title\">3. 5W1H 6채널 분석<\/div>';\n    CHANNELS.forEach(ch => {\n      const g = CHANNEL_GRADES[ch.key];\n      const aPct = (g.a/g.total)*100, bPct = (g.b/g.total)*100, cPct = (g.c/g.total)*100;\n      html += '<div class=\"preview-channel\">';\n      html += '<span class=\"preview-channel-label\">' + ch.label + '<\/span>';\n +xml\"/>' +\n    '<Default Extension=\"xml\" ContentType=\"application/xml\"/>' +\n    '<Override PartName=\"/word/document.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml\"/>' +\n    '<\/Types>');\n  zip.file('_rels/.rels',\n    '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>' +\n    '<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">' +\n    '<Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"word/document.xml\"/>' +\n    '<\/Relationships>');\n  zip.file('word/document.xml', documentXml);\n\n  return await zip.generateAsync({\n    type: 'blob',\n    mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'\n  });\n}\n\n// ============================================\n// [핵심] 진짜 PPTX 생성 - pptxgenjs\n// ============================================\nasync function generatePPTXBlob() {\n  const pres = new PptxGenJS();\n  pres.layout = 'LAYOUT_WIDE'; // 13.333 x 7.5 inches\n  const tpl = TEMPLATES[selectedTemplate];\n\n  // 슬라이드 1: 표지\n  let slide = pres.addSlide();\n  slide.background = { color: 'FFFFFF' };\n  slide.addText('AX-2026-0508 자동 생성', {\n    x: 5.17, y: 1.5, w: 3, h: 0.4,\n    fontSize: 14, bold: true, color: 'FFFFFF', align: 'center',\n    fill: { color: '1A237E' }\n  });\n  slide.addText(tpl.name, {\n    x: 0.5, y: 2.5, w: 12.33, h: 1.5,\n    fontSize: 60, bold: true, color: '1A237E', align: 'center',\n    fontFace: '맑은 고딕'\n  });\n  slide.addText('대상 기간: ' + formatPeriod(), {\n    x: 0.5, y: 4.2, w: 12.33, h: 0.6,\n    fontSize: 24, color: '000000', align: 'center', bold: true\n  });\n  slide.addText('📅 ' + formatDate(new Date()) + '   ·   👤 AX-00000   ·   📦 PowerPoint', {\n    x: 0.5, y: 5.0, w: 12.33, h: 0.5,\n    fontSize: 16, color: '555555', align: 'center'\n  });\n  slide.addShape(pres.ShapeType.line, {\n    x: 4, y: 5.8, w: 5.33, h: 0,\n    lin , 'C 등급', '합계', '정상률']];\n    const tableData = CHANNELS.map(ch => {\n      const g = CHANNEL_GRADES[ch.key];\n      const pct = ((g.a / g.total) * 100).toFixed(1) + '%';\n      return [ch.label, ch.ko, String(g.a), String(g.b), String(g.c), String(g.total), pct];\n    });\n\n    const allRows = tableHeaders.concat(tableData).map((row, idx) =>\n      row.map(cell => ({\n        text: cell,\n        options: idx === 0\n          ? { bold: true, color: 'FFFFFF', fill: { color: '1A237E' }, align: 'center', fontSize: 14 }\n          : { color: '000000', align: 'center', fontSize: 13 }\n      }))\n    );\n\n    slide.addTable(allRows, {\n      x: 0.5, y: 1.5, w: 12.33, h: 4.5,\n      border: { type: 'solid', color: '1A237E', pt: 1 },\n      fontFace: '맑은 고딕'\n    });\n  }\n\n  // 슬라이드 5: 추이\n  if (selectedSections.has('trend')) {\n    slide = pres.addSlide();\n    addSlideHeader(pres, slide, '4. 처리 추이 분석');\n    slide.addChart(pres.ChartType.line, [{\n      name: '일별 처리량',\n      labels: ['5/02', '5/03', '5/04', '5/05', '5/06', '5/07', '5/08'],\n      values: [120, 145, 132, 158, 142, 168, 175]\n    }], {\n      x: 0.5, y: 1.5, w: 12.33, h: 5,\n      chartColors: ['7B1F2A'],\n      lineSize: 3,\n      lineDataSymbolSize: 10,\n      catAxisLabelFontSize: 14,\n      valAxisLabelFontSize: 14,\n      showLegend: false,\n      showTitle: true,\n      title: '최근 7일 처리량 추이',\n      titleFontSize: 18,\n      titleColor: '1A237E'\n    });\n  }\n\n  // 슬라이드 6: 활동\n  if (selectedSections.has('activity')) {\n    slide = pres.addSlide();\n    addSlideHeader(pres, slide, '5. 주요 활동 내역');\n    const activities = [\n      '✅ 품질 평가 정기 실행 - 78% A 등급 달성',\n      '🤖 자동 보완 2회 실행 - C 등급 → B 등급 개선',\n      '📚 신규 매뉴얼 3건 학습 완료 (안전관리 분야)',\n      '📑 주간 안전 보고서 1건 자동 생성',\n      '🔍 일일 검색·질의응답 175건 처리 (최고치)'\n    ];\n    activities.forEach((act, i) => {\n      slide.addShape(pres.ShapeType.roundRect, {\n        x: 0.5, y: 1.5 + i * 1, w: 12.33, h: 0.8,\n        fill: { color: 'F5F7FF' },\n        line: { color: '1A237E', width: 1 },\n        rectRadius: 0.05\n      });\n      slide.addText(act, {\n        x: 0.7, y: 1.5 + i * 1, w: 12, h: 0.8,\n        fontSize: 18, color: '000000', valign: 'middle', bold: true\n      });\n    });\n  }\n\n  // 슬라이드 7: 권고\n  if (selectedSections.has('rec')) {\n    slide = pres.addSlide();\n    addSlideHeader(pres, slide, '6. 권고사항');\n    const recs = [\n      { icon: '⚠️', title: 'Who 채널 보완 권장', desc: '미흡 데이터 74개 잔존, 자동 보완 모드 실행 권장' },\n      { icon: '📚', title: '교육·훈련 분야 강화', desc: '데이터 128개로 다른 분야 대비 부족' },\n      { icon: '📈', title: '사용량 증가 대응', desc: '일일 검색량 12% 증가, 시스템 자원 모니터링 필요' }\n    ];\n    recs.forEach((r, i) => {\n      slide.addShape(pres.ShapeType.roundRect, {\n        x: 0.5, y: 1.5 + i * 1.6, w: 12.33, h: 1.4,\n        fill: { color: 'FFF5F5' },\n        line: { color: '7B1F2A', width: 4 },\n        rectRadius: 0.1\n      });\n      slide.addText(r.icon + ' ' + r.title, {\n        x: 0.7, y: 1.6 + i * 1.6, w: 12, h: 0.5,\n        fontSize: 22, color: '7B1F2A', bold: true\n      });\n      slide.addText(r.desc, {\n        x: 0.7, y: 2.2 + i * 1.6, w: 12, h: 0.5,\n        fontSize: 16, color: '000000'\n      });\n    });\n  }\n\n  return await pres.write({ outputType: 'blob' });\n}\n\nfunction addSlideHeader(pres, slide, title) {\n  slide.background = { color: 'FFFFFF' };\n  slide.addShape(pres.ShapeType.rect, {\n    x: 0, y: 0, w: 13.33, h: 0.8,\n    fill: { color: '1A237E' }\n  });\n  slide.addText(title, {\n    x: 0.5, y: 0.1, w: 10, h: 0.6,\n    fontSize: 24, color: 'FFFFFF', bold: true, valign: 'middle'\n  });\n  slide.addText('AX-2026-0508', {\n    x: 10.5, y: 0.1, w: 2.5, h: 0.6,\n    fontSize: 12, color: 'FFFFFF', align: 'right', valign: 'middle'\n  });\n}\n\n// ============================================\n// 통합 다운로드\n// ============================================\nasync function generateBlob() {\n  if (selectedFormat === 'pdf') return await generatePDFBlob();\n  if (selectedFormat === 'docx') return await generateDOCXBlob();\n  if (selectedFormat === 'pptx') return await generatePPTXBlob();\n  throw new Error('지원하지 않는 형식');\n}\n\nasync function downloadWithPicker(fileName, fmt) {\n  if (!supportsFilePicker) {\n    showToast('이 브라우저는 위치 선택을 지원하지 않습니다', 'error');\n    return await downloadDefault(fileName, fmt);\n  }\n\n  showToast('📦 파일 생성 중...', '');\n\n  try {\n    const blob = await generateBlob();\n\n    const handle = await window.showSaveFilePicker({\n      suggestedName: fileName,\n      types: [{\n        description: fmt.name + ' 파일',\n        accept: { [fmt.mime]: [fmt.ext] }\n      }]\n    });\n    const writable = await handle.createWritable();\n    await writable.write(blob);\n    await writable.close();\n    showToast('✅ 저장 완료: ' + handle.name);\n    return { saved: true, name: handle.name };\n  } catch (e) {\n    if (e.name === 'AbortError') {\n      showToast('저장이 취소되었습니다', 'warn');\n      return { cancelled: true };\n    }\n    console.error('저장 오류:', e);\n    showToast('⚠️ 오류: ' + e.message, 'error');\n    return { error: true };\n  }\n}\n\nasync function downloadDefault(fileName, fmt) {\n  showToast('📦 파일 생성 중...', '');\n\n  try {\n    const blob = await generateBlob();\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = fileName;\n    document.body.appendChild(a);\n    a.click();\n    document.body.removeChild(a);\n    setTimeout(() => URL.revokeObjectURL(url), 1000);\n    showToast('✅ 다운로드 완료: ' + fileName);\n    return { saved: true, name: fileName };\n  } catch (e) {\n    console.error('생성 오류:', e);\n    showToast('⚠️ 오류: ' + e.message, 'error');\n    return { error: true };\n  }\n}\n\nfunction showToast(message, type) {\n  const toast = document.getElementById('toast');\n  document.getElementById('toastText').textContent = message;\n  toast.classList.remove('error', 'warn');\n  if (type === 'error') toast.classList.add('error');\n  else if (type === 'warn') toast.classList.add('warn');\n  toast.classList.add('show');\n  clearTimeout(window._toastTimer);\n  window._toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);\n}\n\nconst generateBtn = document.getElementById('generateBtn');\nconst genProgress = document.getElementById('genProgress');\nconst genText = document.getElementById('genText');\nconst genSub = document.getElementById('genSub');\n\ngenerateBtn.addEventListener('click', async () => {\n  if (selectedSections.size === 0) {\n    showToast('⚠️ 포함할 섹션을 1개 이상 선택해 주세요', 'error');\n    return;\n  }\n  if (selectedCategories.size === 0) {\n    showToast('⚠️ 포함할 분야를 1개 이상 선택해 주세요', 'error');\n    return;\n  }\n\n  generateBtn.disabled = true;\n  genProgress.classList.add('show');\n\n  const stages = [\n    { text: '데이터 수집 중...', sub: '대상 기간 데이터 추출' },\n    { text: '6채널 분석 중...', sub: 'Why·What·When·Where·Who·How 통계' },\n    { text: '차트 생성 중...', sub: '시각화 자료 생성' },\n    { text: '보고서 작성 중...', sub: FORMAT_INFO[selectedFormat].name + ' 형식으로 변환' },\n    { text: '최종 검증...', sub: '품질 점검 완료' }\n  ];\n\n  for (const s of stages) {\n    genText.textContent = s.text;\n    genSub.textContent = s.sub;\n    await new Promise(r => setTimeout(r, 500));\n  }\n\n  genProgress.classList.remove('show');\n  generateBtn.disabled = false;\n\n  showCompletionModal();\n});\n\nfunction showCompletionModal() {\n  const tpl = TEMPLATES[selectedTemplate];\n  const fmt = FORMAT_INFO[selectedFormat];\n  const fileName = getFinalFileName();\n\n  document.getElementById('modalMsg').innerHTML =\n    tpl.name + '이(가) ' + fmt.name + ' 형식으로 생성됐습니다.<br>저장 방식을 선택하세요.';\n\n  document.getElementById('modalInfo').innerHTML =\n    '<div class=\"modal-info-row\"><span class=\"modal-info-label\">파일명<\/span><span class=\"modal-info-value\">' + fileName + '<\/span><\/div>' +\n    '<div class=\"modal-info-row\"><span class=\"modal-info-label\">형식<\/span><span class=\"modal-info-value\">' + fmt.name + ' (진짜 ' + fmt.ext + ')<\/span><\/div>' +\n    '<div class=\"modal-info-row\"><span class=\"modal-info-label\">대상 기간<\/span><span class=\"modal-info-value\">' + formatPeriod() + '<\/span><\/div>' +\n    '<div class=\"modal-info-row\"><span class=\"modal-info-label\">포함 섹션<\/span><span class=\"modal-info-value\">' + selectedSections.size + '개<\/span><\/div>';\n\n  document.getElementById('modalPreview').onclick = () => {\n    document.getElementById('modal').classList.remove('show');\n    document.getElementById('previewPaper').scrollIntoView({ behavior: 'smooth', block: 'center' });\n  };\n\n  const savePickerBtn = document.getElementById('modalSavePicker');\n  savePickerBtn.disabled = !supportsFilePicker;\n  savePickerBtn.style.opacity = supportsFilePicker ? '1' : '0.5';\n  savePickerBtn.onclick = async () => {\n    document.getElementById('modal').classList.remove('show');\n    const result = await downloadWithPicker(fileName, fmt);\n    if (result && result.saved) addToRecent(tpl, fmt, result.name);\n  };\n\n  document.getElementById('modalSaveDefault').onclick = async () => {\n    document.getElementById('modal').classList.remove('show');\n    const result = await downloadDefault(fileName, fmt);\n    if (result && result.saved) addToRecent(tpl, fmt, fileName);\n  };\n\n  document.getElementById('modal').classList.add('show');\n}\n\nfunction addToRecent(tpl, fmt, fileName) {\n  const newReport = {\n    icon: fmt.icon,\n    title: tpl.name + ' (방금 생성)',\n    period: formatPeriod(),\n    format: fmt.name.toUpperCase(),\n    status: '완료',\n    time: '방금'\n  };\n  RECENT_REPORTS.unshift(newReport);\n  if (RECENT_REPORTS.length > 6) RECENT_REPORTS.pop();\n  renderRecentTable();\n}\n\ndocument.getElementById('modal').addEventListener('click', e => {\n  if (e.target === document.getElementById('modal')) {\n    document.getElementById('modal').classList.remove('show');\n  }\n});\n\ndocument.querySelectorAll('.bottom-btn[data-nav]').forEach(btn => {\n  btn.addEventListener('click', () => {\n    const nav = btn.dataset.nav;\n    const labels = { 'search': '🔍 검색', 'qa': '💬 AI 질의응답', 'dashboard': '📊 대시보드' };\n    alert(labels[nav] + ' 화면으로 이동합니다.');\n  });\n});\n\nsetTodayDates();\ndocument.getElementById('customFileName').placeholder = generateAutoFileName();\nrenderRecentTable();\nrenderPreview();\n<\/script>\n\n<\/body>\n<\/html>\n"};

const iframe = document.getElementById('content');
const loading = document.getElementById('loading');
const nav = document.getElementById('nav');

SCREENS_META.forEach(function(s, idx) {
  var btn = document.createElement('button');
  btn.className = 'nav-item' + (idx === 0 ? ' active' : '');
  btn.dataset.screen = s.key;
  btn.innerHTML = '<span class="nav-item-icon">' + s.icon + '</span><span>' + s.name + '</span>';
  btn.addEventListener('click', function() { navigateTo(s.key); });
  nav.appendChild(btn);
});

function navigateTo(key) {
  if (!SCREENS_CONTENT[key]) {
    console.error('Screen not found:', key);
    return;
  }
  var items = document.querySelectorAll('.nav-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle('active', items[i].dataset.screen === key);
  }
  iframe.srcdoc = SCREENS_CONTENT[key];
  setTimeout(function() { loading.classList.add('hidden'); }, 300);
  var meta = SCREENS_META.find(function(s) { return s.key === key; });
  if (meta) document.title = 'axdata.co.kr · ' + meta.name;
}

iframe.addEventListener('load', function() {
  loading.classList.add('hidden');
});

window.addEventListener('message', function(e) {
  if (e.data && e.data.action === 'navigate' && SCREENS_CONTENT[e.data.screen]) {
    navigateTo(e.data.screen);
  }
});

navigateTo('hero');
</script>
