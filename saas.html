function decodeContent(b64) {
  try {
    var bytes = Uint8Array.from(atob(b64), function(c) { return c.charCodeAt(0); });
    return new TextDecoder('utf-8').decode(bytes);
  } catch (e) {
    console.error('Decode error:', e);
    return '<html><body><h1>화면 디코딩 오류</h1></body></html>';
  }
}

var iframe = document.getElementById('content');
var loading = document.getElementById('loading');
var nav = document.getElementById('nav');

SCREENS_META.forEach(function(s, idx) {
  var btn = document.createElement('button');
  btn.className = 'nav-item' + (idx === 0 ? ' active' : '');
  btn.dataset.screen = s.key;
  btn.innerHTML = '<span class="nav-item-icon">' + s.icon + '</span><span>' + s.name + '</span>';
  btn.addEventListener('click', function() { navigateTo(s.key); });
  nav.appendChild(btn);
});

function navigateTo(key) {
  if (!SCREENS_B64[key]) { console.error('Screen not found:', key); return; }
  var items = document.querySelectorAll('.nav-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle('active', items[i].dataset.screen === key);
  }
  loading.classList.remove('hidden');
  iframe.srcdoc = decodeContent(SCREENS_B64[key]);
  setTimeout(function() { loading.classList.add('hidden'); }, 300);
  var meta = SCREENS_META.find(function(s) { return s.key === key; });
  if (meta) document.title = 'axdata.co.kr · ' + meta.name;
  // 스크롤 맨 위로
  try { window.scrollTo(0, 0); } catch(e) {}
}

iframe.addEventListener('load', function() { loading.classList.add('hidden'); });

// iframe 안의 화면이 보낸 navigation 메시지 수신
window.addEventListener('message', function(e) {
  if (e.data && e.data.action === 'navigate' && SCREENS_B64[e.data.screen]) {
    navigateTo(e.data.screen);
  }
});

navigateTo('hero');
