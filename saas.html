<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>axdata.co.kr - AX 자동화 SaaS</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; margin: 0; background: #f5f5f5; }

  /* 헤더 */
  .header {
    background: #1A237E;
    color: #ffffff;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-icon {
    background: #ffffff;
    color: #1A237E;
    width: 42px;
    height: 42px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 900;
  }

  .logo-text {
    display: flex;
    flex-direction: column;
  }

  .logo-title {
    font-size: 19px;
    font-weight: 900;
    line-height: 1.2;
  }

  .logo-domain {
    font-size: 12px;
    opacity: 0.85;
    font-weight: 700;
    font-family: 'Courier New', monospace;
  }

  .sys-info-area {
    display: flex;
    gap: 18px;
    font-size: 13px;
    font-weight: 700;
  }

  .sys-info-item {
    display: flex;
    flex-direction: column;
    text-align: right;
  }

  .sys-info-label {
    font-size: 11px;
    opacity: 0.75;
  }

  .sys-info-value {
    font-family: 'Courier New', monospace;
    font-weight: 900;
    font-size: 14px;
  }

  /* 네비게이션 */
  .nav {
    background: #ffffff;
    border-bottom: 3px solid #1A237E;
    padding: 0 28px;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    position: sticky;
    top: 70px;
    z-index: 99;
  }

  .nav-item {
    padding: 14px 22px;
    color: #555;
    font-weight: 900;
    font-size: 15px;
    cursor: pointer;
    border-bottom: 4px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-item:hover {
    color: #1A237E;
    background: #f5f7ff;
  }

  .nav-item.active {
    color: #7B1F2A;
    border-bottom-color: #7B1F2A;
    background: #fff5f5;
  }

  .nav-item-icon {
    font-size: 20px;
  }

  /* 콘텐츠 */
  .content-area {
    background: #ffffff;
    min-height: calc(100vh - 130px);
    position: relative;
  }

  .iframe-loading {
    position: absolute;
    inset: 0;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 10;
    transition: opacity 0.3s;
  }

  .iframe-loading.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loading-spinner {
    width: 48px;
    height: 48px;
    border: 5px solid #f0f0f0;
    border-top: 5px solid #7B1F2A;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .loading-text {
    color: #1A237E;
    font-size: 15px;
    font-weight: 900;
  }

  .content-iframe {
    width: 100%;
    height: calc(100vh - 130px);
    border: none;
    display: block;
  }

  /* 모바일 대응 */
  @media (max-width: 768px) {
    .header {
      padding: 12px 18px;
      flex-direction: column;
      gap: 10px;
    }
    .sys-info-area { gap: 12px; }
    .sys-info-item { text-align: center; }
    .nav {
      padding: 0 12px;
      top: 110px;
    }
    .nav-item {
      padding: 12px 14px;
      font-size: 13px;
    }
    .content-iframe {
      height: calc(100vh - 200px);
    }
  }
</style>
</head>
<body>

<header class="header">
  <div class="logo-area">
    <div class="logo-icon">AX</div>
    <div class="logo-text">
      <div class="logo-title">AX 자동화 시스템</div>
      <div class="logo-domain">axdata.co.kr · 빅데이터기술연구원㈜</div>
    </div>
  </div>
  <div class="sys-info-area">
    <div class="sys-info-item">
      <span class="sys-info-label">시스템 ID</span>
      <span class="sys-info-value">AX-2026-0508</span>
    </div>
    <div class="sys-info-item">
      <span class="sys-info-label">사용자</span>
      <span class="sys-info-value">AX-00000</span>
    </div>
    <div class="sys-info-item">
      <span class="sys-info-label">데이터</span>
      <span class="sys-info-value">1,248개</span>
    </div>
  </div>
</header>

<nav class="nav">
  <div class="nav-item active" data-screen="hero">
    <span class="nav-item-icon">🏠</span>
    <span>홈</span>
  </div>
  <div class="nav-item" data-screen="upload">
    <span class="nav-item-icon">📁</span>
    <span>파일 업로드</span>
  </div>
  <div class="nav-item" data-screen="search">
    <span class="nav-item-icon">🔍</span>
    <span>검색</span>
  </div>
  <div class="nav-item" data-screen="qa">
    <span class="nav-item-icon">💬</span>
    <span>AI 질의응답</span>
  </div>
  <div class="nav-item" data-screen="dashboard">
    <span class="nav-item-icon">📊</span>
    <span>대시보드</span>
  </div>
  <div class="nav-item" data-screen="report">
    <span class="nav-item-icon">📑</span>
    <span>보고서</span>
  </div>
</nav>

<div class="content-area">
  <div class="iframe-loading" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">화면을 불러오는 중입니다...</div>
  </div>
  <iframe class="content-iframe" id="content" src="" frameborder="0"></iframe>
</div>

<script>
const SCREENS = {
  hero:      { src: 'saas_hero_fix_v2.html',         name: '홈' },
  upload:    { src: 'saas_screen2_upload_v8.html',   name: '파일 업로드' },
  search:    { src: 'saas_screen3_search.html',      name: '검색' },
  qa:        { src: 'saas_screen4_qa.html',          name: 'AI 질의응답' },
  dashboard: { src: 'saas_screen5_dashboard_v2.html', name: '대시보드' },
  report:    { src: 'saas_screen6_report_v6.html',   name: '보고서' }
};

const iframe = document.getElementById('content');
const loading = document.getElementById('loading');
const navItems = document.querySelectorAll('.nav-item');

function navigateTo(screenKey) {
  const screen = SCREENS[screenKey];
  if (!screen) return;

  // 메뉴 활성화
  navItems.forEach(item => {
    item.classList.toggle('active', item.dataset.screen === screenKey);
  });

  // 로딩 표시
  loading.classList.remove('hidden');

  // iframe 로드
  iframe.src = screen.src;

  // URL 해시 업데이트 (북마크/뒤로가기 지원)
  if (window.location.hash !== '#' + screenKey) {
    window.history.pushState({ screen: screenKey }, '', '#' + screenKey);
  }

  // 페이지 제목 업데이트
  document.title = 'axdata.co.kr · ' + screen.name;
}

// iframe 로드 완료 시
iframe.addEventListener('load', () => {
  setTimeout(() => loading.classList.add('hidden'), 200);
});

// 메뉴 클릭
navItems.forEach(item => {
  item.addEventListener('click', () => navigateTo(item.dataset.screen));
});

// 뒤로가기/앞으로가기
window.addEventListener('popstate', e => {
  const hash = window.location.hash.substring(1) || 'hero';
  if (SCREENS[hash]) {
    navItems.forEach(i => i.classList.toggle('active', i.dataset.screen === hash));
    iframe.src = SCREENS[hash].src;
  }
});

// iframe 내부에서 부모 메시지 수신 (화면 전환 요청)
window.addEventListener('message', e => {
  if (e.data && e.data.action === 'navigate' && SCREENS[e.data.screen]) {
    navigateTo(e.data.screen);
  }
});

// 초기 화면 (URL 해시 기반)
const initialScreen = window.location.hash.substring(1) || 'hero';
if (SCREENS[initialScreen]) {
  navigateTo(initialScreen);
} else {
  navigateTo('hero');
}
</script>

</body>
</html>
